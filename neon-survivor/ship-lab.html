<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship 01 Carbon Lab</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:18px}.lab{max-width:760px;margin:auto}h1{text-align:center;font-size:19px;letter-spacing:.12em}.stage{position:relative;width:min(94vw,620px);height:min(125vw,720px);min-height:560px;margin:14px auto;background:radial-gradient(circle at 50% 45%,#102c46 0,#06101d 52%,#020711 82%);border:1px solid #45dcff55;overflow:hidden;touch-action:none}.shipMover{position:absolute;z-index:3;width:260px;height:260px;left:50%;top:42%;transform:translate(-50%,-50%);touch-action:none}.auraCore{position:absolute;z-index:1;inset:0;pointer-events:none}.auraGhost{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.auraGhost.a{transform:scale(1.045);opacity:1}.auraGhost.b{transform:scale(1.095);opacity:.82}.auraGhost.c{transform:scale(1.15);opacity:.48}.shipLayer{position:absolute;inset:0;z-index:2}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}.carbon{position:absolute;inset:0;z-index:3;opacity:.92;background-color:#101317;background-image:linear-gradient(45deg,#323840 25%,transparent 25%,transparent 75%,#323840 75%),linear-gradient(45deg,#090b0e 25%,#1b2026 25%,#1b2026 75%,#090b0e 75%);background-position:0 0,5px 5px;background-size:10px 10px;mask:url('./assets/ships/modular/falcon/falcon_color_mask.png') center/contain no-repeat;-webkit-mask:url('./assets/ships/modular/falcon/falcon_color_mask.png') center/contain no-repeat;mix-blend-mode:multiply}.carbon:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 18%,#ffffff30 43%,transparent 58%),linear-gradient(180deg,#ffffff18,transparent 32%,#0007 78%);mix-blend-mode:screen}.engineGroup{position:absolute;z-index:1;inset:0;transform-origin:50% 88.5%;pointer-events:none}.engineFire{position:absolute;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.controls{display:grid;gap:10px;justify-items:center}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #4bdfff88;background:#071827;color:#eaffff;font-weight:800;border-radius:9px}.on{border-color:#ff9b31;box-shadow:0 0 12px #ff7a0055}.status{text-align:center;font:12px/1.5 monospace;color:#9edbe8}.hint{text-align:center;color:#d7faff;font-size:13px}.carbonOff .carbon{display:none}</style></head><body><main class="lab"><h1>SHIP 01 · CARBON TEST</h1><div id="stage" class="stage" style="--aura:#00d9ff"><div id="ship" class="shipMover"><div class="auraCore"><img class="auraGhost a" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><img class="auraGhost b" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><img class="auraGhost c" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"></div><div class="shipLayer"><div id="engineGroup" class="engineGroup"><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=12"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=12"></div><img class="base" src="./assets/ships/modular/falcon/falcon_base.png?v=12"><div class="carbon"></div></div></div></div><div class="controls"><div class="row"><button id="carbon" class="on">CARBON ON/OFF</button><button id="auto">AUTO MOVE ON/OFF</button></div></div><p class="hint">בדיקת קרבון כללית: הטקסטורה נוצרת בקוד ונחתכת דרך ה־color mask של Ship 01.</p><div class="status">No ship-shaped carbon asset · same material system can be reused on future ships.</div></main><script>const stage=document.querySelector('#stage'),ship=document.querySelector('#ship'),group=document.querySelector('#engineGroup'),ghosts=[...document.querySelectorAll('.auraGhost')];let aura='#00d9ff',drag=false,auto=true,start=performance.now();function applyAura(){const f=[`brightness(0) saturate(100%) drop-shadow(0 0 2px ${aura}) drop-shadow(0 0 5px ${aura})`,`brightness(0) saturate(100%) drop-shadow(0 0 5px ${aura}) drop-shadow(0 0 10px ${aura})`,`brightness(0) saturate(100%) drop-shadow(0 0 9px ${aura}) drop-shadow(0 0 18px ${aura})`];ghosts.forEach((g,i)=>g.style.filter=f[i])}applyAura();function place(x,y){const r=stage.getBoundingClientRect(),w=ship.offsetWidth,h=ship.offsetHeight;x=Math.max(w/2,Math.min(r.width-w/2,x));y=Math.max(h/2,Math.min(r.height-h/2,y));ship.style.left=x+'px';ship.style.top=y+'px'}stage.addEventListener('pointerdown',e=>{drag=true;auto=false;stage.setPointerCapture(e.pointerId);const r=stage.getBoundingClientRect();place(e.clientX-r.left,e.clientY-r.top)});stage.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect();place(e.clientX-r.left,e.clientY-r.top)});stage.addEventListener('pointerup',()=>drag=false);stage.addEventListener('pointercancel',()=>drag=false);document.querySelector('#carbon').onclick=e=>{stage.classList.toggle('carbonOff');e.currentTarget.classList.toggle('on',!stage.classList.contains('carbonOff'))};document.querySelector('#auto').onclick=()=>auto=!auto;function frame(now){const t=(now-start)/1000,sy=1+Math.sin(t*15)*.065+Math.sin(t*27)*.035,sx=1+Math.sin(t*11)*.025+Math.sin(t*19)*.015,op=.91+Math.sin(t*17)*.055,glow=6+Math.sin(t*13)*2;group.style.transform=`scale(${sx},${sy})`;group.style.opacity=op;group.style.filter=`drop-shadow(0 0 ${glow}px #ff8a2b)`;if(auto){const r=stage.getBoundingClientRect();place(r.width/2+Math.sin(t*1.35)*(r.width*.25),r.height*.42+Math.sin(t*.82)*35)}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
