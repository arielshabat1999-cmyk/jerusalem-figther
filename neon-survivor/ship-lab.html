<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship 01 Steel Test</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:18px}.lab{max-width:760px;margin:auto}h1{text-align:center;font-size:19px;letter-spacing:.12em}.stage{position:relative;width:min(94vw,620px);height:min(125vw,720px);min-height:560px;margin:14px auto;background:radial-gradient(circle at 50% 45%,#102c46 0,#06101d 52%,#020711 82%);border:1px solid #45dcff55;overflow:hidden}.ship{position:absolute;width:300px;height:300px;left:50%;top:43%;transform:translate(-50%,-50%)}.aura{position:absolute;inset:0;z-index:1}.aura img,.base,.details{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.a1{transform:scale(1.045);opacity:.9}.a2{transform:scale(1.10);opacity:.55}.base{z-index:3}
.steel{position:absolute;inset:0;z-index:4;background-color:rgba(155,170,184,.30);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.30) 0 1px,rgba(92,108,122,.08) 1px 2px,rgba(235,242,247,.20) 2px 3px,rgba(20,30,38,.10) 3px 4px),linear-gradient(100deg,rgba(35,48,58,.22) 0%,rgba(225,238,246,.58) 18%,rgba(88,108,122,.20) 31%,rgba(245,250,252,.72) 45%,rgba(72,92,108,.18) 57%,rgba(210,225,235,.48) 74%,rgba(35,48,58,.25) 100%);background-size:100% 4px,100% 100%;-webkit-mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;opacity:.68;mix-blend-mode:screen}.steel:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 8%,rgba(255,255,255,.18) 22%,rgba(255,255,255,.78) 39%,rgba(170,200,218,.20) 52%,rgba(255,255,255,.48) 66%,transparent 84%);opacity:.82;mix-blend-mode:screen}.details{z-index:5;opacity:.52;mix-blend-mode:luminosity;pointer-events:none}
.engineGroup{position:absolute;z-index:2;inset:0;transform-origin:50% 88.5%;pointer-events:none}.engineFire{position:absolute;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.controls{text-align:center;margin:12px}button{padding:11px 16px;border:1px solid #a9d8ef;background:#071827;color:#fff;font-weight:900;border-radius:9px}.off .steel,.off .details{display:none}.status{text-align:center;font:12px/1.5 monospace;color:#9edbe8}
</style></head><body><main class="lab"><h1>SHIP 01 · BRUSHED STEEL TEST</h1><div id="stage" class="stage"><div class="ship"><div class="aura"><img class="a1" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><img class="a2" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"></div><div id="eng" class="engineGroup"><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=19"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=19"></div><img class="base" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png?v=19"><div class="steel"></div><img class="details" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png?v=18"></div></div></div><div class="controls"><button id="toggle">STEEL ON / OFF</button></div><div class="status">Bright silver brushed steel — no carbon weave. Original Ship 01 geometry preserved.</div></main><script>
const stage=document.querySelector('#stage'),eng=document.querySelector('#eng'),auras=[...document.querySelectorAll('.aura img')],aura='#00d9ff';auras[0].style.filter=`brightness(0) drop-shadow(0 0 4px ${aura}) drop-shadow(0 0 8px ${aura})`;auras[1].style.filter=`brightness(0) drop-shadow(0 0 8px ${aura}) drop-shadow(0 0 16px ${aura})`;document.querySelector('#toggle').onclick=()=>stage.classList.toggle('off');let start=performance.now();function frame(n){const t=(n-start)/1000,sy=1+Math.sin(t*15)*.07+Math.sin(t*27)*.03,sx=1+Math.sin(t*11)*.025+Math.sin(t*19)*.015;eng.style.transform=`scale(${sx},${sy})`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
