<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship 01 Gold Test</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:18px}.lab{max-width:760px;margin:auto}h1{text-align:center;font-size:19px;letter-spacing:.12em}.stage{position:relative;width:min(94vw,620px);height:min(125vw,720px);min-height:560px;margin:14px auto;background:radial-gradient(circle at 50% 45%,#102c46 0,#06101d 52%,#020711 82%);border:1px solid #45dcff55;overflow:hidden}.ship{position:absolute;width:300px;height:300px;left:50%;top:43%;transform:translate(-50%,-50%)}.aura{position:absolute;inset:0;z-index:1}.aura img,.base,.details{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.a1{transform:scale(1.045);opacity:.9}.a2{transform:scale(1.10);opacity:.55}.base{z-index:3}
.gold{position:absolute;inset:0;z-index:4;background-color:rgba(190,135,22,.34);background-image:repeating-linear-gradient(0deg,rgba(255,245,185,.22) 0 1px,rgba(120,78,8,.08) 1px 3px,rgba(240,190,55,.18) 3px 4px,rgba(72,42,2,.10) 4px 6px),linear-gradient(102deg,rgba(88,48,3,.30) 0%,rgba(245,184,45,.70) 18%,rgba(145,92,8,.26) 31%,rgba(255,238,142,.82) 44%,rgba(158,104,9,.24) 58%,rgba(242,181,42,.62) 74%,rgba(78,43,2,.32) 100%);background-size:100% 6px,100% 100%;-webkit-mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;opacity:.76;mix-blend-mode:screen}.gold:before{content:"";position:absolute;inset:0;background:linear-gradient(102deg,transparent 8%,rgba(255,232,135,.22) 22%,rgba(255,250,205,.88) 39%,rgba(242,185,48,.22) 52%,rgba(255,226,118,.58) 66%,transparent 84%);opacity:.82;mix-blend-mode:screen}.details{z-index:5;opacity:.52;mix-blend-mode:luminosity;pointer-events:none}
.engineGroup{position:absolute;z-index:2;inset:0;transform-origin:50% 88.5%;pointer-events:none}.engineFire{position:absolute;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.controls{text-align:center;margin:12px}button{padding:11px 16px;border:1px solid #a9d8ef;background:#071827;color:#fff;font-weight:900;border-radius:9px}.off .gold,.off .details{display:none}.status{text-align:center;font:12px/1.5 monospace;color:#9edbe8}
</style></head><body><main class="lab"><h1>SHIP 01 · GOLD TEST</h1><div id="stage" class="stage"><div class="ship"><div class="aura"><img class="a1" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><img class="a2" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"></div><div id="eng" class="engineGroup"><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=21"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=21"></div><img class="base" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png?v=21"><div class="gold"></div><img class="details" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png?v=18"></div></div></div><div class="controls"><button id="toggle">GOLD ON / OFF</button></div><div class="status">Polished gold finish. Original Ship 01 geometry and panel detail preserved.</div></main><script>
const stage=document.querySelector('#stage'),eng=document.querySelector('#eng'),auras=[...document.querySelectorAll('.aura img')],aura='#00d9ff';auras[0].style.filter=`brightness(0) drop-shadow(0 0 4px ${aura}) drop-shadow(0 0 8px ${aura})`;auras[1].style.filter=`brightness(0) drop-shadow(0 0 8px ${aura}) drop-shadow(0 0 16px ${aura})`;document.querySelector('#toggle').onclick=()=>stage.classList.toggle('off');let start=performance.now();function frame(n){const t=(n-start)/1000,sy=1+Math.sin(t*15)*.07+Math.sin(t*27)*.03,sx=1+Math.sin(t*11)*.025+Math.sin(t*19)*.015;eng.style.transform=`scale(${sx},${sy})`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
