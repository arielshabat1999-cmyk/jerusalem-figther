<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship 01 Aura Lab</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:18px}.lab{max-width:760px;margin:auto}h1{text-align:center;font-size:19px;letter-spacing:.12em}.stage{position:relative;width:min(94vw,620px);height:min(125vw,720px);min-height:560px;margin:14px auto;background:radial-gradient(circle at 50% 45%,#102c46 0,#06101d 52%,#020711 82%);border:1px solid #45dcff55;overflow:hidden;touch-action:none}.trailLayer{position:absolute;inset:0;z-index:1;pointer-events:none}.trailStamp{position:absolute;width:175px;height:130px;border-radius:50%;transform:translate(-50%,-50%);background:var(--aura);filter:blur(24px);box-shadow:0 0 35px 12px var(--aura);pointer-events:none;opacity:.42}.shipMover{position:absolute;z-index:3;width:220px;height:220px;left:50%;top:42%;transform:translate(-50%,-50%);touch-action:none}.auraCore{position:absolute;z-index:1;left:50%;top:52%;width:84%;height:84%;transform:translate(-50%,-50%);border-radius:48%;border:8px solid var(--aura);background:transparent;box-shadow:0 0 14px 7px var(--aura),0 0 35px 16px var(--aura),inset 0 0 18px 4px var(--aura);filter:blur(5px);opacity:.72;pointer-events:none}.shipLayer{position:absolute;inset:0;z-index:2}.base,.tint{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.base{z-index:2}.tint{z-index:3;background:#00bfff;mix-blend-mode:color;mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;-webkit-mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat}.engineGroup{position:absolute;z-index:1;inset:0;transform-origin:50% 88.5%;pointer-events:none}.engineFire{position:absolute;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.controls{display:grid;gap:10px;justify-items:center}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.sw{width:42px;height:42px;border-radius:50%;border:2px solid #ffffff66;background:var(--c);padding:0}.sw.active{outline:3px solid white;outline-offset:2px}button{padding:10px 14px;border:1px solid #4bdfff88;background:#071827;color:#eaffff;font-weight:800;border-radius:9px}.status{text-align:center;font:12px/1.5 monospace;color:#9edbe8}.hint{text-align:center;color:#d7faff;font-size:13px}</style></head><body><main class="lab"><h1>SHIP 01 · AURA + BRUSH TRAIL</h1><div id="stage" class="stage" style="--aura:#00d9ff"><div id="trail" class="trailLayer"></div><div id="ship" class="shipMover"><div class="auraCore"></div><div class="shipLayer"><div id="engineGroup" class="engineGroup"><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=8"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=8"></div><img class="base" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><div class="tint"></div></div></div></div><div class="controls"><div class="row"><button class="sw active" style="--c:#00d9ff" data-c="#00d9ff"></button><button class="sw" style="--c:#8b5cff" data-c="#8b5cff"></button><button class="sw" style="--c:#ff2f92" data-c="#ff2f92"></button><button class="sw" style="--c:#ff3b30" data-c="#ff3b30"></button><button class="sw" style="--c:#ffb000" data-c="#ffb000"></button><button class="sw" style="--c:#42ff77" data-c="#42ff77"></button><button class="sw" style="--c:#ffffff" data-c="#ffffff"></button></div><div class="row"><button id="auto">AUTO MOVE ON/OFF</button><button id="clear">CLEAR TRAIL</button></div></div><p class="hint">עכשיו ההילה בכוונה חזקה וברורה. גרור את החללית כדי לראות את משיכת האור.</p><div class="status">Aura uses border + box-shadow for reliable mobile rendering. Color controls core and trail together.</div></main><script>const stage=document.querySelector('#stage'),ship=document.querySelector('#ship'),trail=document.querySelector('#trail'),group=document.querySelector('#engineGroup');let aura='#00d9ff',drag=false,auto=true,lastX=null,lastY=null,lastStamp=0,start=performance.now();function place(x,y,stamp=true){const r=stage.getBoundingClientRect(),w=ship.offsetWidth,h=ship.offsetHeight;x=Math.max(w/2,Math.min(r.width-w/2,x));y=Math.max(h/2,Math.min(r.height-h/2,y));ship.style.left=x+'px';ship.style.top=y+'px';if(stamp&&lastX!==null){const d=Math.hypot(x-lastX,y-lastY);if(d>3&&performance.now()-lastStamp>18){makeStamp(lastX,lastY,d);lastStamp=performance.now()}}lastX=x;lastY=y}function makeStamp(x,y,speed){const e=document.createElement('div');e.className='trailStamp';e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--aura',aura);const stretch=Math.min(1.7,1+speed/65);e.style.transform=`translate(-50%,-50%) scale(${stretch},.72)`;trail.appendChild(e);const born=performance.now(),life=520;function fade(n){const p=(n-born)/life;if(p>=1){e.remove();return}e.style.opacity=String((1-p)*.42);e.style.filter=`blur(${24+p*16}px)`;requestAnimationFrame(fade)}requestAnimationFrame(fade)}stage.addEventListener('pointerdown',e=>{drag=true;auto=false;stage.setPointerCapture(e.pointerId);const r=stage.getBoundingClientRect();place(e.clientX-r.left,e.clientY-r.top,false)});stage.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect();place(e.clientX-r.left,e.clientY-r.top,true)});stage.addEventListener('pointerup',()=>drag=false);stage.addEventListener('pointercancel',()=>drag=false);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{aura=b.dataset.c;stage.style.setProperty('--aura',aura);document.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('#auto').onclick=()=>{auto=!auto;lastX=lastY=null};document.querySelector('#clear').onclick=()=>trail.innerHTML='';function frame(now){const t=(now-start)/1000;const sy=1+Math.sin(t*15)*.065+Math.sin(t*27)*.035,sx=1+Math.sin(t*11)*.025+Math.sin(t*19)*.015,op=.91+Math.sin(t*17)*.055,glow=6+Math.sin(t*13)*2;group.style.transform=`scale(${sx},${sy})`;group.style.opacity=op;group.style.filter=`drop-shadow(0 0 ${glow}px #ff8a2b)`;if(auto){const r=stage.getBoundingClientRect();const x=r.width/2+Math.sin(t*1.35)*(r.width*.25),y=r.height*.42+Math.sin(t*.82)*35;place(x,y,true)}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
