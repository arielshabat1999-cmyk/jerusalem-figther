<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship Lab 01</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:20px}.lab{max-width:720px;margin:auto}h1{text-align:center;font-size:20px;letter-spacing:.15em}.stage{position:relative;width:min(92vw,512px);height:calc(min(92vw,512px) + 420px);margin:16px auto;background:radial-gradient(circle at 50% 28%,#12304b 0,#06101d 48%,#020711 75%);border:1px solid #45dcff55;overflow:visible}.shipLayer{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;overflow:visible}.shipLayer>img.base,.shipLayer>.tint{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.base{z-index:2}.tint{z-index:3;background:#00bfff;mix-blend-mode:color;mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;-webkit-mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat}.engineFire{position:absolute;z-index:5;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 7px #ff8a2b)}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.anchor{position:absolute;z-index:8;transform:translate(-50%,-50%);pointer-events:none;color:#ff7a22}.anchor:before,.anchor:after{content:"";position:absolute;background:currentColor}.anchor:before{width:20px;height:2px;left:-10px;top:-1px}.anchor:after{width:2px;height:20px;left:-1px;top:-10px}.anchor span{position:absolute;white-space:nowrap;font-size:9px;font-weight:900;left:8px;top:7px}.controls{text-align:center;margin:14px}button{padding:11px 14px;border:1px solid #4bdfff88;background:#071827;color:#eaffff;font-weight:800;border-radius:9px}.fireOff .engineFire{display:none}.status{text-align:center;font:12px/1.5 monospace;color:#9edbe8}</style></head><body><main class="lab"><h1>SHIP 01 · ENGINE FIRE TEST</h1><div id="stage" class="stage"><div class="shipLayer"><img class="base" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><div class="tint"></div><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=3"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=3"><div class="anchor" style="left:39%;top:88.5%"><span>ENGINE L</span></div><div class="anchor" style="left:61%;top:88.5%"><span>ENGINE R</span></div></div></div><div class="controls"><button id="fire">FIRE ON/OFF</button></div><div class="status">Mobile preview fix: stage = ship height + 420px.<br>Anchors locked: L 39% / R 61% · flame visuals opened 0.5% outward.</div></main><script>const stage=document.querySelector('#stage');document.querySelector('#fire').onclick=()=>stage.classList.toggle('fireOff');</script></body></html>
