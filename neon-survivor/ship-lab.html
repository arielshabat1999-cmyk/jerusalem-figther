<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship Lab 01</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:20px}.lab{max-width:720px;margin:auto}.stage{position:relative;width:min(92vw,512px);aspect-ratio:1;margin:16px auto;background:radial-gradient(circle,#12304b 0,#06101d 55%,#020711 78%);border:1px solid #45dcff55;overflow:hidden}.stage img,.tint{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.base{z-index:1}.mask{z-index:3;display:none}.tint{z-index:2;background:#00bfff;mix-blend-mode:color;mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;-webkit-mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat}.debug .mask{display:block;opacity:.48;filter:sepia(1) saturate(20) hue-rotate(300deg)}.maskonly .base,.maskonly .tint{display:none}.maskonly .mask{display:block;opacity:1}.baseonly .tint{display:none}.controls{display:grid;gap:10px}.row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}button{padding:11px 14px;border:1px solid #4bdfff88;background:#071827;color:#eaffff;font-weight:800;border-radius:9px}.sw{width:42px;height:42px;padding:0;background:var(--c)}h1{text-align:center;font-size:20px;letter-spacing:.15em}.note{text-align:center;color:#7eb7c5;font-size:12px}</style></head><body><main class="lab"><h1>SHIP 01 · MASK LAB</h1><div id="stage" class="stage"><img class="base" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><div id="tint" class="tint"></div><img class="mask" src="./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png"></div><div class="controls"><div class="row"><button data-mode="color">COLOR</button><button data-mode="debug">OVERLAY DEBUG</button><button data-mode="baseonly">BASE</button><button data-mode="maskonly">MASK</button></div><div class="row"><button class="sw" style="--c:#00bfff" data-color="#00bfff"></button><button class="sw" style="--c:#ff334f" data-color="#ff334f"></button><button class="sw" style="--c:#54ff7a" data-color="#54ff7a"></button><button class="sw" style="--c:#9c5cff" data-color="#9c5cff"></button><button class="sw" style="--c:#f6f6f6" data-color="#f6f6f6"></button><button class="sw" style="--c:#ffbf38" data-color="#ffbf38"></button></div></div><p class="note">OVERLAY DEBUG צריך לשבת פיקסל־לפיקסל על לוחות החללית. אם הקווים זזים — המסכה אינה תקינה.</p></main><script>const s=document.querySelector('#stage'),t=document.querySelector('#tint');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>s.className='stage '+(b.dataset.mode==='color'?'':b.dataset.mode));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{t.style.background=b.dataset.color;s.className='stage'});</script></body></html>
