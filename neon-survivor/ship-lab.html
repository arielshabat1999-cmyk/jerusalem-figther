<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship 01 Carbon Lab</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:18px}.lab{max-width:760px;margin:auto}h1{text-align:center;font-size:19px;letter-spacing:.12em}.stage{position:relative;width:min(94vw,620px);height:min(125vw,720px);min-height:560px;margin:14px auto;background:radial-gradient(circle at 50% 45%,#102c46 0,#06101d 52%,#020711 82%);border:1px solid #45dcff55;overflow:hidden}.ship{position:absolute;width:300px;height:300px;left:50%;top:43%;transform:translate(-50%,-50%)}.aura{position:absolute;inset:0;z-index:1}.aura img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.a1{transform:scale(1.045);opacity:.9}.a2{transform:scale(1.10);opacity:.55}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3}.carbon{position:absolute;inset:0;z-index:4;background:#171a1e;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 3px,rgba(30,34,39,.95) 3px 6px,rgba(0,0,0,.85) 6px 9px,rgba(100,108,118,.55) 9px 12px),repeating-linear-gradient(-45deg,rgba(0,0,0,.45) 0 4px,rgba(255,255,255,.10) 4px 8px);background-size:17px 17px,17px 17px;-webkit-mask-image:url('./assets/ships/modular/falcon/falcon_color_mask.png');mask-image:url('./assets/ships/modular/falcon/falcon_color_mask.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;opacity:1}.carbon:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.35) 44%,transparent 58%),linear-gradient(180deg,rgba(255,255,255,.18),transparent 38%,rgba(0,0,0,.45));}.engineGroup{position:absolute;z-index:2;inset:0;transform-origin:50% 88.5%;pointer-events:none}.engineFire{position:absolute;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.controls{text-align:center;margin:12px}button{padding:11px 16px;border:1px solid #ff9b31;background:#071827;color:#fff;font-weight:900;border-radius:9px}.off .carbon{display:none}.status{text-align:center;font:12px/1.5 monospace;color:#9edbe8}</style></head><body><main class="lab"><h1>SHIP 01 · CARBON VISIBILITY TEST</h1><div id="stage" class="stage"><div class="ship"><div class="aura"><img class="a1" src="./assets/ships/modular/falcon/falcon_base.png"><img class="a2" src="./assets/ships/modular/falcon/falcon_base.png"></div><div id="eng" class="engineGroup"><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=13"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=13"></div><img class="base" src="./assets/ships/modular/falcon/falcon_base.png?v=13"><div class="carbon"></div></div></div><div class="controls"><button id="toggle">CARBON ON / OFF</button></div><div class="status">Carbon weave enlarged and high-contrast for validation. It is clipped by falcon_color_mask.png.</div></main><script>const stage=document.querySelector('#stage'),eng=document.querySelector('#eng'),auras=[...document.querySelectorAll('.aura img')];const aura='#00d9ff';auras[0].style.filter=`brightness(0) drop-shadow(0 0 4px ${aura}) drop-shadow(0 0 8px ${aura})`;auras[1].style.filter=`brightness(0) drop-shadow(0 0 8px ${aura}) drop-shadow(0 0 16px ${aura})`;document.querySelector('#toggle').onclick=()=>stage.classList.toggle('off');let start=performance.now();function frame(n){const t=(n-start)/1000,sy=1+Math.sin(t*15)*.07+Math.sin(t*27)*.03,sx=1+Math.sin(t*11)*.025+Math.sin(t*19)*.015;eng.style.transform=`scale(${sx},${sy})`;requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
