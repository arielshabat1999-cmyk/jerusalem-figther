<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship Lab 01</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:20px}.lab{max-width:720px;margin:auto}h1,h2{text-align:center}.assetTest{position:relative;width:min(92vw,420px);aspect-ratio:1;margin:16px auto;background:repeating-conic-gradient(#152638 0 25%,#0a1420 0 50%) 50%/28px 28px;border:3px solid #ff8a2b;overflow:hidden}.assetTest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.topCenter{position:absolute;z-index:5;left:50%;top:0;transform:translate(-50%,-50%);width:22px;height:22px;border:2px solid #00ff9d;border-radius:50%}.topCenter:before,.topCenter:after{content:"";position:absolute;background:#00ff9d}.topCenter:before{width:34px;height:2px;left:-8px;top:8px}.topCenter:after{width:2px;height:34px;left:8px;top:-8px}.label{position:absolute;z-index:6;left:50%;top:16px;transform:translateX(-50%);font:800 11px monospace;color:#00ff9d;background:#020711cc;padding:4px 7px}.status{text-align:center;font:12px monospace;color:#9edbe8}.stage{position:relative;width:min(92vw,512px);height:min(112vw,620px);margin:28px auto 16px;background:radial-gradient(circle at 50% 44%,#12304b 0,#06101d 55%,#020711 78%);border:1px solid #45dcff55;overflow:hidden}.shipLayer{position:absolute;left:0;top:0;width:100%;aspect-ratio:1}.shipLayer>img.base,.shipLayer>.tint{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.base{z-index:2}.tint{z-index:3;background:#00bfff;mix-blend-mode:color;mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;-webkit-mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat}.engineFire{position:absolute;z-index:5;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 7px #ff8a2b)}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.anchor{position:absolute;z-index:8;transform:translate(-50%,-50%);pointer-events:none;color:#ff7a22}.anchor:before,.anchor:after{content:"";position:absolute;background:currentColor}.anchor:before{width:20px;height:2px;left:-10px;top:-1px}.anchor:after{width:2px;height:20px;left:-1px;top:-10px}.anchor span{position:absolute;white-space:nowrap;font-size:9px;font-weight:900;left:8px;top:7px}.controls{text-align:center;margin:10px}button{padding:11px 14px;border:1px solid #4bdfff88;background:#071827;color:#eaffff;font-weight:800;border-radius:9px}.fireOff .engineFire{display:none}</style></head><body><main class="lab"><h1>ENGINE ASSET DIAGNOSTIC</h1><div class="assetTest"><img id="rawEngine" src="./assets/ships/modular/falcon/falcon_engine_base.png"><div class="topCenter"></div><div class="label">PNG TOP CENTER</div></div><div id="status" class="status">loading engine asset…</div><h2>SHIP 01 ATTACHMENT TEST</h2><div id="stage" class="stage"><div class="shipLayer"><img class="base" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><div class="tint"></div><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png"><div class="anchor" style="left:39%;top:88.5%"><span>ENGINE L</span></div><div class="anchor" style="left:61%;top:88.5%"><span>ENGINE R</span></div></div></div><div class="controls"><button id="fire">FIRE ON/OFF</button></div><div class="status">Engine anchors stay locked: L 39%,88.5% · R 61%,88.5%<br>Flame visual centers: L 38.5% · R 61.5% (0.5% outward each)<br>Attachment: top-center · fire size unchanged.</div></main><script>const img=document.querySelector('#rawEngine'),status=document.querySelector('#status'),stage=document.querySelector('#stage');function ok(){status.textContent='LOADED ✓ natural size: '+img.naturalWidth+' × '+img.naturalHeight}function bad(){status.textContent='FAILED TO LOAD ✕ '+img.src}img.addEventListener('load',ok);img.addEventListener('error',bad);if(img.complete)(img.naturalWidth?ok():bad());document.querySelector('#fire').onclick=()=>stage.classList.toggle('fireOff');</script></body></html>
