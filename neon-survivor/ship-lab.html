<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ship 01 Gloss Carbon</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#eaffff;font-family:system-ui}body{padding:18px}.lab{max-width:760px;margin:auto}h1{text-align:center;font-size:19px;letter-spacing:.12em}.stage{position:relative;width:min(94vw,620px);height:min(125vw,720px);min-height:560px;margin:14px auto;background:radial-gradient(circle at 50% 45%,#102c46 0,#06101d 52%,#020711 82%);border:1px solid #45dcff55;overflow:hidden}.ship{position:absolute;width:300px;height:300px;left:50%;top:43%;transform:translate(-50%,-50%)}.aura{position:absolute;inset:0;z-index:1}.aura img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.a1{transform:scale(1.045);opacity:.9}.a2{transform:scale(1.10);opacity:.55}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3}.carbon{position:absolute;inset:0;z-index:4;background-color:#090b0e;background-image:linear-gradient(135deg,rgba(255,255,255,.34) 0 8%,rgba(20,23,28,.96) 8% 25%,rgba(0,0,0,.95) 25% 42%,rgba(78,86,96,.62) 42% 50%,rgba(5,7,9,.96) 50% 67%,rgba(150,160,172,.24) 67% 75%,rgba(8,10,13,.98) 75% 100%),linear-gradient(45deg,rgba(255,255,255,.14) 0 12%,transparent 12% 50%,rgba(255,255,255,.08) 50% 62%,transparent 62%);background-size:16px 16px,16px 16px;-webkit-mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;mask:url('./assets/ships/16C439C9-A511-416A-B8C5-2B2974A2B999.png') center/contain no-repeat;opacity:.94}.carbon:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 5%,rgba(255,255,255,.08) 22%,rgba(255,255,255,.52) 38%,rgba(255,255,255,.13) 48%,transparent 64%),linear-gradient(180deg,rgba(255,255,255,.22),transparent 30%,rgba(255,255,255,.08) 52%,rgba(0,0,0,.36) 85%);mix-blend-mode:screen}.carbon:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 38% 22%,rgba(255,255,255,.26),transparent 30%),radial-gradient(ellipse at 68% 62%,rgba(255,255,255,.13),transparent 24%);mix-blend-mode:screen}.engineGroup{position:absolute;z-index:2;inset:0;transform-origin:50% 88.5%;pointer-events:none}.engineFire{position:absolute;width:22%;height:auto;transform:translateX(-50%);transform-origin:50% 0}.engineL{left:38.5%;top:88.5%}.engineR{left:61.5%;top:88.5%}.controls{text-align:center;margin:12px}button{padding:11px 16px;border:1px solid #ff9b31;background:#071827;color:#fff;font-weight:900;border-radius:9px}.off .carbon{display:none}.status{text-align:center;font:12px/1.5 monospace;color:#9edbe8}</style></head><body><main class="lab"><h1>SHIP 01 · GLOSS CARBON TEST</h1><div id="stage" class="stage"><div class="ship"><div class="aura"><img class="a1" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"><img class="a2" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png"></div><div id="eng" class="engineGroup"><img class="engineFire engineL" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=14"><img class="engineFire engineR" src="./assets/ships/modular/falcon/falcon_engine_base.png?v=14"></div><img class="base" src="./assets/ships/58D42652-A462-43D9-ADB7-6CC517916A4C.png?v=14"><div class="carbon"></div></div></div><div class="controls"><button id="toggle">CARBON ON / OFF</button></div><div class="status">Approved Ship 01 base · glossy woven carbon · original Ship 01 material mask.</div></main><script>const stage=document.querySelector('#stage'),eng=document.querySelector('#eng'),auras=[...document.querySelectorAll('.aura img')],aura='#00d9ff';auras[0].style.filter=`brightness(0) drop-shadow(0 0 4px ${aura}) drop-shadow(0 0 8px ${aura})`;auras[1].style.filter=`brightness(0) drop-shadow(0 0 8px ${aura}) drop-shadow(0 0 16px ${aura})`;document.querySelector('#toggle').onclick=()=>stage.classList.toggle('off');let start=performance.now();function frame(n){const t=(n-start)/1000,sy=1+Math.sin(t*15)*.07+Math.sin(t*27)*.03,sx=1+Math.sin(t*11)*.025+Math.sin(t*19)*.015;eng.style.transform=`scale(${sx},${sy})`;requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
