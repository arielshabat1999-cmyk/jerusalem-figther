y='visible';try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(_){}},{once:true});frame.srcdoc=html}catch(e){badge.textContent='V47 LIVE · LOAD ERROR';load.innerHTML='LOAD ERROR<br><small style="display:block;margin-top:12px;letter-spacing:.05em;color:#fff">Tap refresh and try again</small>';console.error(e)}})();</script></body></html>
