<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#01040a">
  <title>Neon Survivor — Asteroid Runner</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;color:#7ef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #load{position:fixed;inset:0;z-index:20;display:block;background:#01040a url('./assets/ui/loading-hangar-v99.webp?v=20260918v120') center/cover no-repeat;overflow:hidden}
    #load:before{content:"";position:absolute;inset:-20% 0 auto;height:22%;background:linear-gradient(180deg,transparent,#5deaff14,transparent);mix-blend-mode:screen;animation:loadScan99 4.8s linear infinite;pointer-events:none}
    .loadPanel99{position:absolute;left:11%;right:11%;bottom:8.2%;min-height:15%;display:flex;flex-direction:column;justify-content:center;padding:12px 4.5%;border:1px solid #38ddff99;background:linear-gradient(180deg,#061827f4,#020912fa);box-shadow:0 0 24px #1edfff55,inset 0 0 22px #000;clip-path:polygon(4% 0,96% 0,100% 17%,100% 83%,96% 100%,4% 100%,0 83%,0 17%);text-align:center}
    .loadTitle99{color:#efffff;font:1000 clamp(16px,5vw,31px)/1 system-ui,-apple-system,sans-serif;letter-spacing:.08em;text-shadow:0 0 12px #36dfff;margin-bottom:11px}.loadTrack99{position:relative;height:18px;border:2px solid #37dfff;background:#020812;box-shadow:0 0 10px #24dfff66,inset 0 0 8px #000;overflow:hidden}.loadTrack99 i{display:block;height:100%;width:3%;background:repeating-linear-gradient(90deg,#32dfff 0 18px,#90f7ff 18px 22px,#08283b 22px 25px);box-shadow:0 0 14px #3ceaff;transition:width .18s ease}.loadPct99{position:absolute;right:5%;top:50%;transform:translateY(-50%);color:#e8ffff;font:1000 clamp(14px,4vw,24px)/1 system-ui;text-shadow:0 0 10px #37dfff}.loadStatus99{margin-top:10px;color:#6eeeff;font:900 clamp(8px,2.5vw,12px)/1 system-ui;letter-spacing:.26em;text-shadow:0 0 8px #32dfff}
    @keyframes loadScan99{to{transform:translateY(600%)}}@media(min-aspect-ratio:3/4){#load{background-size:contain}.loadPanel99{width:min(500px,70vw);left:50%;right:auto;transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){#load:before{animation:none}}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;visibility:hidden;background:#01040a}
    #outerVersion{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483647;padding:7px 10px;border:2px solid #9de5ff;border-radius:9px;background:#05070df2;color:#d9f6ff;font:900 11px/1 system-ui,-apple-system,sans-serif;letter-spacing:.11em;box-shadow:0 0 18px #68d7ff77;pointer-events:none;max-width:94vw;white-space:nowrap;transition:opacity .28s}
    #outerVersion.ready{opacity:0}
  </style>
</head>
<body>
  <div id="outerVersion">V122 LIVE · WAIT</div>
  <div id="load"><div class="loadPanel99"><div class="loadTitle99">PREPARING LAUNCH</div><div class="loadTrack99"><i id="loadFill99"></i></div><b id="loadPct99" class="loadPct99">3%</b><div id="loadStatus99" class="loadStatus99">INITIALIZING SYSTEMS</div></div></div>
  <iframe id="game" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe>
  <script>
  const VERSION='20260918v122',badge=document.getElementById('outerVersion');
  let renderState='WAIT',ctrlState='WAIT',shipState='',bossState='',enemyState='',hudState='',modularState='',frameLoaded99=false,revealGame99=()=>{};
  function paint(){badge.textContent='V122 LIVE · '+renderState+(modularState==='MODULAR SHIP READY'?' · FALCON READY':modularState==='MODULAR SHIP ERROR'?' · FALCON ERROR':'')+(shipState==='SHIPS ON'?' · SHIPS ON':shipState==='SHIP ERROR'?' · SHIP ERROR':'')+(bossState==='BOSSES ON'?' · BOSSES ON':bossState==='BOSS ERROR'?' · BOSS ERROR':'')+(enemyState==='ENEMIES ON'?' · ENEMIES ON':enemyState==='ENEMY ERROR'?' · ENEMY ERROR':'')+(hudState==='HUD ON'?' · HUD ON':'')+(ctrlState==='ON'?' · CTRL ON':ctrlState==='ERROR'?' · CTRL ERROR':'')}
  addEventListener('message',e=>{const d=e.data;if(!d||typeof d.status!=='string')return;if(d.source==='cinematic-v48')renderState=d.status;else if(d.source==='controls-v48')ctrlState=d.status;else if(d.source==='ships-v107')shipState=d.status;else if(d.source==='ship-modular-v120'){modularState=d.status;revealGame99()}else if(d.source==='bosses-v51')bossState=d.status;else if(d.source==='enemies-v52')enemyState=d.status;else if(d.source==='hud-polish-v61')hudState=d.status;paint()});
  (async()=>{
    const load=document.getElementById('load'),frame=document.getElementById('game'),fill99=document.getElementById('loadFill99'),pct99=document.getElementById('loadPct99'),status99=document.getElementById('loadStatus99');
    let revealed99=false;
    revealGame99=()=>{
      if(revealed99||!frameLoaded99)return;
      if(modularState==='MODULAR SHIP ERROR'){
        setLoad99(100,'FALCON ASSET ERROR · REFRESH');
        badge.textContent='V122 LIVE · FALCON ERROR';
        return;
      }
      if(modularState!=='MODULAR SHIP READY'){
        setLoad99(97,'ASSEMBLING MODULAR FALCON');
        return;
      }
      revealed99=true;
      setLoad99(100,'LAUNCH SYSTEMS READY');
      setTimeout(()=>{
        load.style.display='none';frame.style.visibility='visible';
        setTimeout(()=>{badge.classList.add('ready');setTimeout(()=>badge.style.display='none',300)},650);
        try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(_){}
      },180);
    };
    let fetched99=0;const expected99=51,setLoad99=(n,s)=>{n=Math.max(3,Math.min(100,n|0));fill99.style.width=n+'%';pct99.textContent=n+'%';if(s)status99.textContent=s};
    try{
      const get=async f=>{const r=await fetch('./'+f+'?v='+VERSION,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);const txt=await r.text();fetched99++;const q=Math.min(94,4+Math.round(fetched99/expected99*90));setLoad99(q,q<34?'LOADING FLIGHT SYSTEMS':q<68?'CALIBRATING WEAPONS':'MAPPING SECTOR');return txt};
      const parts=[];for(let i=0;i<7;i++)parts.push(await get('v2part'+i+'.txt'));
      const legacy=['shop-v3a.txt','shop-v3b.txt','combat-v4.txt','progress-v5.txt','fix-v6.txt','garage-v7.txt','garage-v7b.txt','garage-library-v107.txt','compact-v8.txt','enemy-flow-v10.txt','weapon-evolution-v11.txt','visual-v12.txt','visual-polish-v13.txt','final-polish-v15.txt'];
      const bridge=await get('bridge-v42.txt'),legacyTxt=[];for(const f of legacy)legacyTxt.push(await get(f));
      const gameplay=await get('gameplay-v32.txt'),art=await get('cinematic-v48-clean.txt'),gift=await get('gifts-v55.txt'),ships=await get('ships-v107.txt'),modularShips=await get('ship-modular-v120.txt'),bosses=await get('bosses-v51.txt'),enemies=await get('enemies-v52.txt'),asteroids=await get('asteroids-v59.txt'),stageFlow=await get('stage-flow-v53.txt'),waveDirector=await get('wave-director-v77.txt'),hudPolish=await get('hud-polish-v61.txt'),debris=await get('debris-v78.txt'),arsenal=await get('arsenal-v63.txt'),odyssey=await get('weapon-odyssey-v73.txt'),ending=await get('gameover-v76.txt'),destruction=await get('destruction-fx-v80.txt'),deepSpace=await get('deep-space-v81.txt'),combatDirector=await get('combat-director-v82.txt'),evolution=await get('evolution-director-v83.txt'),performancePack=await get('performance-v84.txt'),cosmicBackground=await get('cosmic-background-v86.txt'),xpBuilds=await get('xp-builds-v87.txt'),neonUI=await get('neon-ui-v89.txt'),combatArt=await get('combat-art-v90.txt'),levelTerminal=await get('levelup-reference-v94.txt'),armoredHud=await get('hud-reactor-v97.txt'),sectorResume=await get('sector-resume-v98.txt'),menuTerminal=await get('menu-terminal-v99.txt'),garageShell=await get('garage-shell-v118.txt'),timeSurvival=await get('time-survival-v108.txt');
      let html=parts.join(''),k=html.lastIndexOf('})();');if(k<0)throw new Error('game closure not found');
      const deferred='\nsetTimeout(()=>{\ntry{\n'+gameplay+'\n}catch(e){console.error("GAMEPLAY V32 DEFERRED FAILED",e)}\ntry{\n'+art+'\n'+gift+'\n'+ships+'\n'+modularShips+'\n'+bosses+'\n'+enemies+'\n'+asteroids+'\n'+stageFlow+'\n'+waveDirector+'\n'+hudPolish+'\n'+debris+'\n'+arsenal+'\n'+odyssey+'\n'+ending+'\n'+destruction+'\n'+deepSpace+'\n'+combatDirector+'\n'+evolution+'\n'+performancePack+'\n'+cosmicBackground+'\n'+xpBuilds+'\n'+neonUI+'\n'+combatArt+'\n'+levelTerminal+'\n'+armoredHud+'\n'+sectorResume+'\n'+menuTerminal+'\n'+garageShell+'\n}catch(e){console.error("CINEMATIC V120 FAILED",e);try{parent.postMessage({source:"arsenal-v63",status:"ARSENAL ERROR"},"*")}catch(_){}}\n},0);\n';
      const compat='\nconst bridgeEnemy65=drawEnemy;\nfunction drawBoss(e){bridgeEnemy65(e)}\nfunction enemyLaser(b){if(!b)return;X.save();X.globalCompositeOperation="lighter";X.fillStyle="#ff7288";X.shadowBlur=12;X.shadowColor="#ff526c";X.beginPath();X.arc(b.x,b.y,Math.max(2,b.r||3),0,Math.PI*2);X.fill();X.restore()}\n';
      html=html.slice(0,k)+compat+bridge+'\n'+deferred+'\n'+legacyTxt.join('')+'\n'+timeSurvival+'\n'+html.slice(k);
      frame.addEventListener('load',()=>{frameLoaded99=true;revealGame99()},{once:true});
      frame.srcdoc=html;
    }catch(e){badge.textContent='V120 LIVE · LOAD ERROR';setLoad99(100,'LOAD ERROR · TAP REFRESH');console.error(e)}
  })();
  </script>
</body>
</html>
