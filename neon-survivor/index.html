<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020715"><title>Neon Survivor — Asteroid Runner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020715;color:#7ef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;letter-spacing:.16em;padding:24px}#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;visibility:hidden;background:#020715}</style></head><body><div id="load">LOADING ASTEROID RUNNER…</div><iframe id="game" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe><script>(async()=>{const load=document.getElementById('load'),frame=document.getElementById('game');try{const parts=[];for(let i=0;i<7;i++){const r=await fetch('./part'+i+'.txt?v=20260911d',{cache:'no-store'});if(!r.ok)throw new Error('part'+i+' '+r.status);parts.push(await r.text())}frame.addEventListener('load',()=>{load.style.display='none';frame.style.visibility='visible';try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(_){}},{once:true});frame.srcdoc=parts.join('')}catch(e){load.innerHTML='LOAD ERROR<br><small style="display:block;margin-top:12px;letter-spacing:.05em;color:#fff">Tap refresh and try again</small>';console.error(e)}})();</script></body></html>
