<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020715"><title>Neon Survivor — Asteroid Runner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020715;color:#7ef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;letter-spacing:.16em;padding:24px}#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;visibility:hidden;background:#020715}</style></head><body><div id="load">LOADING ASTEROID RUNNER…</div><iframe id="game" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe><script>(async()=>{const load=document.getElementById('load'),frame=document.getElementById('game');try{const parts=[];for(let i=0;i<7;i++){const r=await fetch('./v2part'+i+'.txt?v=20260911f',{cache:'no-store'});if(!r.ok)throw new Error('v2part'+i+' '+r.status);parts.push(await r.text())}const files=['shop-v3a.txt?v=20260911h','shop-v3b.txt?v=20260911h','combat-v4.txt?v=20260911j','progress-v5.txt?v=20260911k','fix-v6.txt?v=20260911m','garage-v7.txt?v=20260911n','garage-v7b.txt?v=20260911o','compact-v8.txt?v=20260911p','death-v9.txt?v=20260911q','enemy-flow-v10.txt?v=20260911r','weapon-evolution-v11.txt?v=20260911s','visual-v12.txt?v=20260912a','visual-polish-v13.txt?v=20260912b','difficulty-v14.txt?v=20260912c','final-polish-v15.txt?v=20260912d','photo-board-v17-0.txt?v=20260912f','photo-board-v17-1.txt?v=20260912f','photo-board-v17-2.txt?v=20260912f','photo-board-v17-3.txt?v=20260912f','photo-board-v17-4.txt?v=20260912f','photo-board-v17-5.txt?v=20260912f','photoreal-engine-v17.txt?v=20260912f','razor-v23.txt?v=20260912g','shell-v24.txt?v=20260912g','hard-visual-v31.txt?v=20260912h','gameplay-v32.txt?v=20260912i'];const txt=[];for(const f of files){const r=await fetch(
