<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#01040a">
  <title>Neon Survivor — Asteroid Runner</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;color:#7ef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;letter-spacing:.16em;padding:24px}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;visibility:hidden;background:#01040a}
    #outerVersion{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483647;padding:7px 10px;border:2px solid #9de5ff;border-radius:9px;background:#05070df2;color:#d9f6ff;font:900 11px/1 system-ui,-apple-system,sans-serif;letter-spacing:.11em;box-shadow:0 0 18px #68d7ff77;pointer-events:none;max-width:94vw;white-space:nowrap;transition:opacity .28s}
    #outerVersion.ready{opacity:0}
  </style>
</head>
<body>
  <div id="outerVersion">V97 LIVE · WAIT</div>
  <div id="load">LOADING V97…</div>
  <iframe id="game" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe>
  <script>
  const VERSION='20260917v97',badge=document.getElementById('outerVersion');
  let renderState='WAIT',ctrlState='WAIT',shipState='',bossState='',enemyState='',hudState='';
  function paint(){badge.textContent='V97 LIVE · '+renderState+(shipState==='SHIPS ON'?' · SHIPS ON':shipState==='SHIP ERROR'?' · SHIP ERROR':'')+(bossState==='BOSSES ON'?' · BOSSES ON':bossState==='BOSS ERROR'?' · BOSS ERROR':'')+(enemyState==='ENEMIES ON'?' · ENEMIES ON':enemyState==='ENEMY ERROR'?' · ENEMY ERROR':'')+(hudState==='HUD ON'?' · HUD ON':'')+(ctrlState==='ON'?' · CTRL ON':ctrlState==='ERROR'?' · CTRL ERROR':'')}
  addEventListener('message',e=>{const d=e.data;if(!d||typeof d.status!=='string')return;if(d.source==='cinematic-v48')renderState=d.status;else if(d.source==='controls-v48')ctrlState=d.status;else if(d.source==='ships-v50')shipState=d.status;else if(d.source==='bosses-v51')bossState=d.status;else if(d.source==='enemies-v52')enemyState=d.status;else if(d.source==='hud-polish-v61')hudState=d.status;paint()});
  (async()=>{
    const load=document.getElementById('load'),frame=document.getElementById('game');
    try{
      const get=async f=>{const r=await fetch('./'+f+'?v='+VERSION,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()};
      const parts=[];for(let i=0;i<7;i++)parts.push(await get('v2part'+i+'.txt'));
      const legacy=['shop-v3a.txt','shop-v3b.txt','combat-v4.txt','progress-v5.txt','fix-v6.txt','garage-v7.txt','garage-v7b.txt','compact-v8.txt','enemy-flow-v10.txt','weapon-evolution-v11.txt','visual-v12.txt','visual-polish-v13.txt','final-polish-v15.txt'];
      const bridge=await get('bridge-v42.txt'),legacyTxt=[];for(const f of legacy)legacyTxt.push(await get(f));
      const gameplay=await get('gameplay-v32.txt'),art=await get('cinematic-v48-clean.txt'),gift=await get('gifts-v55.txt'),ships=await get('ships-v50.txt'),bosses=await get('bosses-v51.txt'),enemies=await get('enemies-v52.txt'),asteroids=await get('asteroids-v59.txt'),stageFlow=await get('stage-flow-v53.txt'),waveDirector=await get('wave-director-v77.txt'),hudPolish=await get('hud-polish-v61.txt'),debris=await get('debris-v78.txt'),arsenal=await get('arsenal-v63.txt'),odyssey=await get('weapon-odyssey-v73.txt'),special=await get('special-stage-v77.txt'),ending=await get('gameover-v76.txt'),meteor=await get('meteor-rush-v79.txt'),destruction=await get('destruction-fx-v80.txt'),deepSpace=await get('deep-space-v81.txt'),combatDirector=await get('combat-director-v82.txt'),evolution=await get('evolution-director-v83.txt'),performancePack=await get('performance-v84.txt'),cosmicBackground=await get('cosmic-background-v86.txt'),xpBuilds=await get('xp-builds-v87.txt'),neonUI=await get('neon-ui-v89.txt'),combatArt=await get('combat-art-v90.txt'),levelTerminal=await get('levelup-reference-v94.txt'),armoredHud=await get('hud-reactor-v97.txt');
      let html=parts.join(''),k=html.lastIndexOf('})();');if(k<0)throw new Error('game closure not found');
      const deferred='\nsetTimeout(()=>{\ntry{\n'+gameplay+'\n}catch(e){console.error("GAMEPLAY V32 DEFERRED FAILED",e)}\ntry{\n'+art+'\n'+gift+'\n'+ships+'\n'+bosses+'\n'+enemies+'\n'+asteroids+'\n'+stageFlow+'\n'+waveDirector+'\n'+hudPolish+'\n'+debris+'\n'+arsenal+'\n'+odyssey+'\n'+special+'\n'+ending+'\n'+meteor+'\n'+destruction+'\n'+deepSpace+'\n'+combatDirector+'\n'+evolution+'\n'+performancePack+'\n'+cosmicBackground+'\n'+xpBuilds+'\n'+neonUI+'\n'+combatArt+'\n'+levelTerminal+'\n'+armoredHud+'\n}catch(e){console.error("CINEMATIC V97 FAILED",e);try{parent.postMessage({source:"arsenal-v63",status:"ARSENAL ERROR"},"*")}catch(_){}}\n},0);\n';
      const compat='\nconst bridgeEnemy65=drawEnemy;\nfunction drawBoss(e){bridgeEnemy65(e)}\nfunction enemyLaser(b){if(!b)return;X.save();X.globalCompositeOperation="lighter";X.fillStyle="#ff7288";X.shadowBlur=12;X.shadowColor="#ff526c";X.beginPath();X.arc(b.x,b.y,Math.max(2,b.r||3),0,Math.PI*2);X.fill();X.restore()}\n';
      html=html.slice(0,k)+compat+bridge+'\n'+deferred+'\n'+legacyTxt.join('')+'\n'+html.slice(k);
      frame.addEventListener('load',()=>{load.style.display='none';frame.style.visibility='visible';setTimeout(()=>{badge.classList.add('ready');setTimeout(()=>badge.style.display='none',300)},650);try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(_){}},{once:true});
      frame.srcdoc=html;
    }catch(e){badge.textContent='V97 LIVE · LOAD ERROR';load.innerHTML='LOAD ERROR<br><small style="display:block;margin-top:12px;letter-spacing:.05em;color:#fff">Tap refresh and try again</small>';console.error(e)}
  })();
  </script>
</body>
</html>
