<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020715"><title>Neon Survivor — Asteroid Runner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020715;color:#7ef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;letter-spacing:.16em;padding:24px}#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;visibility:hidden;background:#020715}</style></head><body><div id="load">LOADING ASTEROID RUNNER…</div><iframe id="game" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe><script>(async()=>{const load=document.getElementById('load'),frame=document.getElementById('game');try{const parts=[];for(let i=0;i<7;i++){const r=await fetch('./v2part'+i+'.txt?v=20260911f',{cache:'no-store'});if(!r.ok)throw new Error('v2part'+i+' '+r.status);parts.push(await r.text())}const pa=await fetch('./shop-v3a.txt?v=20260911h',{cache:'no-store'}),pb=await fetch('./shop-v3b.txt?v=20260911h',{cache:'no-store'}),pc=await fetch('./combat-v4.txt?v=20260911j',{cache:'no-store'}),pd=await fetch('./progress-v5.txt?v=20260911k',{cache:'no-store'}),pe=await fetch('./fix-v6.txt?v=20260911m',{cache:'no-store'}),pf=await fetch('./garage-v7.txt?v=20260911n',{cache:'no-store'}),pg=await fetch('./garage-v7b.txt?v=20260911o',{cache:'no-store'});if(!pa.ok||!pb.ok||!pc.ok||!pd.ok||!pe.ok||!pf.ok||!pg.ok)throw new Error('patch load');const patch=(await pa.text())+(await pb.text())+(await pc.text())+(await pd.text())+(await pe.text())+(await pf.text())+(await pg.text());let html=parts.join(''),k=html.lastIndexOf('})();');if(k<0)throw new Error('game closure not found');html=html.slice(0,k)+patch+'\n'+html.slice(k);frame.addEventListener('load',()=>{load.style.display='none';frame.style.visibility='visible';try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(_){}},{once:true});frame.srcdoc=html}catch(e){load.innerHTML='LOAD ERROR<br><small style="display:block;margin-top:12px;letter-spacing:.05em;color:#fff">Tap refresh and try again</small>';console.error(e)}})();</script></body></html>
