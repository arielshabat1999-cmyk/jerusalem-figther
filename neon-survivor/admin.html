<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Survivor — Admin</title><style>html,body{margin:0;background:#030712;color:#eefaff;font-family:Inter,system-ui,-apple-system,sans-serif}body{padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 6px}p{color:#8da9bb;line-height:1.45}.group{background:#081421;border:1px solid #1c3b54;border-radius:18px;padding:16px;margin:14px 0}.group h2{font-size:13px;letter-spacing:.12em;color:#67e8f9}.node{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px;margin:8px 0;background:#050d17;border:1px solid #173249;border-radius:12px}.node strong{display:block}.node small{color:#7f99aa}.buttons{display:flex;gap:6px;flex-wrap:wrap}button,select,input,textarea{border:1px solid #2b506d;background:#0b1d2d;color:#eaffff;border-radius:9px;padding:8px;font-weight:800}button.danger{border-color:#71313b}.palette{display:flex;gap:7px;flex-wrap:wrap}.notice{font-size:12px;color:#86efac;margin:12px 0}.io{width:100%;box-sizing:border-box;min-height:90px;font-family:monospace}.row{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #173249}.row small{display:block;color:#7f99aa}</style></head><body><h1>NEON SURVIVOR · ADMIN</h1><p>V2 tuning + authoritative Wave Tree Builder.</p><section class="group"><h2>WAVE TREE BUILDER</h2><div class="palette"><button data-add="small_swarm_6">+ SWARM 6</button><button data-add="small_swarm_10">+ SWARM 10</button><button data-add="medium_trio">+ MEDIUM TRIO</button><button data-add="heavy_escort_6">+ HEAVY + ESCORT</button><button data-add="elite_pair">+ ELITE PAIR</button><button data-add="boss_dreadnought">+ BOSS</button><button id="addRandom">+ RANDOM SWARM</button></div><div id="tree"></div><div class="buttons"><button id="resetTree">RESET TREE</button><button id="exportTree">EXPORT</button><button id="importTree">IMPORT</button></div><textarea id="io" class="io" placeholder="Wave Tree JSON"></textarea></section><div id="tuning"></div><div class="buttons"><button id="resetAll">RESET ALL TUNING</button></div><div id="status" class="notice"></div><script src="src/core/events.js"></script><script src="src/core/storage.js"></script><script src="src/core/config.js"></script><script src="src/data/flight-config.js"></script><script src="src/data/admin-tuning-schema.js"></script><script src="src/services/admin-tuning-service.js"></script><script src="src/data/formation-catalog.js"></script><script src="src/services/wave-tree-service.js"></script><script>const treeEl=document.querySelector('#tree'),tuning=document.querySelector('#tuning'),status=document.querySelector('#status'),io=document.querySelector('#io');const uid=()=>('n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));function mutate(fn){const t=WaveTreeService.active();fn(t);WaveTreeService.upsertTree(t);renderTree()}function renderTree(){const t=WaveTreeService.active();treeEl.innerHTML='';t.nodes.forEach((n,i)=>{const f=n.type==='random'?'RANDOM: '+n.pool.join(' / '):(FormationCatalog.formations[n.formationId]?.class||'')+' · '+n.formationId;const el=document.createElement('div');el.className='node';el.innerHTML='<b>'+(i+1)+'</b><div><strong>'+f+'</strong><small>clear: '+!!n.clearBeforeNext+' · delay: '+(n.delayAfter||0)+'s</small></div><div class="buttons"><button data-up>↑</button><button data-down>↓</button><button data-clear>CLR</button><button data-del class="danger">×</button></div>';el.querySelector('[data-up]').onclick=()=>mutate(x=>{if(i){[x.nodes[i-1],x.nodes[i]]=[x.nodes[i],x.nodes[i-1]]}});el.querySelector('[data-down]').onclick=()=>mutate(x=>{if(i<x.nodes.length-1){[x.nodes[i+1],x.nodes[i]]=[x.nodes[i],x.nodes[i+1]]}});el.querySelector('[data-clear]').onclick=()=>mutate(x=>x.nodes[i].clearBeforeNext=!x.nodes[i].clearBeforeNext);el.querySelector('[data-del]').onclick=()=>mutate(x=>x.nodes.splice(i,1));treeEl.appendChild(el)})}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>mutate(t=>t.nodes.push({id:uid(),type:'formation',formationId:b.dataset.add,clearBeforeNext:false,delayAfter:1.2})));document.querySelector('#addRandom').onclick=()=>mutate(t=>t.nodes.push({id:uid(),type:'random',pool:['small_swarm_6','small_swarm_10'],clearBeforeNext:false,delayAfter:1.2}));document.querySelector('#resetTree').onclick=()=>{WaveTreeService.reset();renderTree();status.textContent='Wave tree reset'};document.querySelector('#exportTree').onclick=()=>io.value=WaveTreeService.export();document.querySelector('#importTree').onclick=()=>{try{WaveTreeService.import(io.value);renderTree();status.textContent='Wave tree imported'}catch(e){status.textContent=e.message}};function renderTuning(){tuning.innerHTML='';for(const group of AdminTuningSchema.groups){const box=document.createElement('section');box.className='group';box.innerHTML='<h2>'+group.label+'</h2>';for(const f of group.fields){const row=document.createElement('div');row.className='row';const v=AdminTuningService.get(f.id);row.innerHTML='<div><b>'+f.label+'</b><small>'+f.id+'</small></div><input type="number" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+v+'">';row.querySelector('input').onchange=e=>{e.target.value=AdminTuningService.set(f.id,e.target.value)};box.appendChild(row)}tuning.appendChild(box)}}document.querySelector('#resetAll').onclick=()=>{AdminTuningService.resetAll();renderTuning()};renderTree();renderTuning();</script></body></html>
