<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Neon Survivor</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712}#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:#030712;color:#eaffff;font:700 14px system-ui;white-space:pre-wrap;padding:24px}</style></head><body><div id="boot">BOOTING…</div><script src="src/core/manifest.js"></script><script>(async()=>{const boot=document.querySelector('#boot');try{for(const src of ARCHITECTURE_MODULES)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src+'?arch=3';s.onload=ok;s.onerror=()=>fail(new Error('Failed to load '+src));document.head.appendChild(s)});await GameBootstrap.start();OfflineServices.install();SessionSystem.begin({playerId:'local-player',gameMode:'solo',authority:'local'});AppFlowSystem.home();boot.remove();GameEvents.emit('app:ready',{screen:'home'})}catch(e){boot.textContent='BOOT FAILED\n\n'+(e.stack||e);console.error(e)}})();</script></body></html>
