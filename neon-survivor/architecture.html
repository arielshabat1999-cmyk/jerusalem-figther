<!doctype html><meta charset="utf-8"><title>Neon Survivor Architecture</title><body><pre id="status">BOOTING…</pre><script src="src/core/manifest.js"></script><script>(async()=>{const out=document.querySelector('#status');try{for(const src of ARCHITECTURE_MODULES){await new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src+'?arch=1';s.onload=ok;s.onerror=()=>fail(new Error('Failed '+src));document.head.appendChild(s)})}await GameBootstrap.start();SessionSystem.begin({playerId:'local-player',gameMode:'solo',authority:'local'});RunSystem.startRun();const p=WorldSystem.spawn({entityType:'player',playerId:'local-player',teamId:'player',health:{current:100,max:100},tags:['player']});const e=WorldSystem.spawn({entityType:'enemy',teamId:'enemy',health:{current:10,max:10},tags:['enemy']});CombatSystem.applyDamage({sourceId:p.entityId,targetId:e.entityId,amount:10});RunSystem.update({elapsedSeconds:10,distance:25,score:100,level:2});const report={bootstrap:GameBootstrap.status,systems:GameSystems.status(),rank:RankSystem.snapshot(),statistics:StatisticsSystem.snapshot(),worldEntities:WorldSystem.list().length};out.textContent='ARCHITECTURE SMOKE TEST PASSED\n\n'+JSON.stringify(report,null,2)}catch(e){out.textContent='ARCHITECTURE SMOKE TEST FAILED\n\n'+(e.stack||e);throw e}})();</script></body>
