<!doctype html><html><head><meta charset="utf-8"><title>Architecture Tests</title><style>body{background:#07101b;color:#eaffff;font:14px monospace;padding:24px}.ok{color:#86efac}.bad{color:#fda4af}</style></head><body><h1>NEON SURVIVOR — ARCHITECTURE TESTS</h1><pre id="out">BOOTING…</pre><script src="../src/core/manifest.js"></script><script>(async()=>{const out=document.querySelector('#out'),results=[];const test=(name,fn)=>{try{const r=fn();if(r===false)throw Error('assertion failed');results.push(['PASS',name])}catch(e){results.push(['FAIL',name,e.message])}};try{for(const src of ARCHITECTURE_MODULES)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='../'+src+'?test=1';s.onload=ok;s.onerror=()=>fail(Error('load '+src));document.head.appendChild(s)});await GameBootstrap.start();OfflineServices.install();SessionSystem.begin({playerId:'test-player',gameMode:'solo',authority:'local'});GameModeSystem.activate('solo');test('dependency graph resolves',()=>GameSystems.status().started.length>0);test('rank has exactly four objectives when active',()=>{const r=RankSystem.snapshot();return r.rank===10||r.objectives.length===4});GameplayLifecycle.newRun();GameClock.pause('tests');test('player spawned',()=>!!WorldSystem.findByPlayerId('test-player'));test('world index returns player',()=>WorldSystem.listByType('player').length===1);const p=WorldSystem.findByPlayerId('test-player');const e=SpawnSystem.enemy('scout',{x:p.transform.x+20,y:p.transform.y});test('enemy index updated',()=>WorldSystem.listByType('enemy').some(x=>x.entityId===e.entityId));CombatSystem.applyDamage({sourceId:p.entityId,targetId:e.entityId,amount:99999});test('dead enemy removed once',()=>!WorldSystem.get(e.entityId));test('weapon reset exists',()=>typeof WeaponSystem.reset==='function');RunCommands.end({reason:'test'});test('post-run damage blocked',()=>CombatSystem.applyDamage({sourceId:null,targetId:p.entityId,amount:1}).applied===0);GameClock.stop()}catch(e){results.push(['FAIL','boot',e.stack||e.message])}out.innerHTML=results.map(r=>`<span class="${r[0]==='PASS'?'ok':'bad'}">${r.join(' — ')}</span>`).join('\n');window.__ARCH_TEST_RESULTS__=results})();</script></body></html>
