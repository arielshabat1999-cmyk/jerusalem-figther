<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Survivor — Admin Tuning</title><style>
html,body{margin:0;background:#030712;color:#eefaff;font-family:Inter,system-ui,-apple-system,sans-serif}body{padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:620px;margin:auto}h1{font-size:24px;margin:0 0 6px}p{color:#8da9bb;margin:0 0 22px;line-height:1.45}.group{background:#081421;border:1px solid #1c3b54;border-radius:18px;padding:16px;margin-bottom:14px}.group h2{font-size:13px;letter-spacing:.12em;color:#67e8f9;margin:0 0 16px}.row{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #173249}.row:first-of-type{border-top:0}.row label{font-weight:800;font-size:13px}.row small{display:block;color:#7f99aa;margin-top:4px}.control{display:flex;gap:6px;align-items:center}.control input{width:74px;background:#030a12;border:1px solid #2b506d;color:#fff;border-radius:10px;padding:9px;font-weight:800;font-size:16px}.control button,.actions button{border:1px solid #2b506d;background:#0b1d2d;color:#eaffff;border-radius:10px;padding:9px 10px;font-weight:900}.actions{display:flex;gap:8px}.notice{font-size:11px;color:#8da9bb;margin-top:14px}.saved{color:#86efac}.analytics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.metric{background:#081421;border:1px solid #1c3b54;border-radius:14px;padding:13px}.metric small{display:block;color:#7f99aa;font-size:10px}.metric b{display:block;font-size:20px;margin-top:4px}.ledger{max-height:330px;overflow:auto}.tx{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid #173249}.tx:first-child{border-top:0}.tx small{display:block;color:#7f99aa}.tx strong.plus{color:#86efac}.tx strong.minus{color:#fca5a5}
</style></head><body><h1>NEON SURVIVOR · ADMIN</h1><p>V2 tuning dashboard. Economy values are configuration only; live Coins/Diamonds remain authoritative in EconomySystem.</p><div id="analytics"></div><div id="app"></div><div class="actions"><button id="resetAll">RESET ALL</button></div><div id="status" class="notice"></div>
<script src="src/core/events.js"></script><script src="src/core/storage.js"></script><script src="src/core/config.js"></script><script src="src/data/flight-config.js"></script><script src="src/data/economy-tuning.js"></script><script src="src/data/admin-tuning-schema.js"></script><script src="src/services/admin-tuning-service.js"></script>
<script>
const app=document.querySelector('#app'),analytics=document.querySelector('#analytics'),status=document.querySelector('#status');
function readBox(k){try{return GameStorage.read(k)||null}catch{return null}}function analyticsData(){const eco=readBox('player.economy.v2')?.data||{},prog=readBox('player.progression.v1')?.data||{},obj=readBox('player.objectives.v2')?.data||{},ach=readBox('player.achievements.v1')?.data||{},ap=readBox('player.ap.v1')?.data||{};const ledger=eco.ledger||[],income=ledger.filter(x=>x.delta>0).reduce((a,x)=>a+x.delta,0),spend=Math.abs(ledger.filter(x=>x.delta<0).reduce((a,x)=>a+x.delta,0)),done=['daily','weekly','player'].reduce((n,k)=>n+(obj[k]?.rewarded?.length||0),0);return{balances:eco.balances||{coins:0,gems:0},xp:prog.lifetimeXP||0,ap:ap.balance||0,ach:(ach.claimed||[]).length,done,income,spend,ledger:[...ledger].reverse().slice(0,80)}}function renderAnalytics(){const a=analyticsData();analytics.innerHTML=`<div class="analytics"><div class="metric"><small>COINS</small><b>◉ ${(a.balances.coins||0).toLocaleString()}</b></div><div class="metric"><small>DIAMONDS</small><b>◆ ${(a.balances.gems||0).toLocaleString()}</b></div><div class="metric"><small>LIFETIME XP</small><b>${a.xp.toLocaleString()}</b></div><div class="metric"><small>AP</small><b>${a.ap.toLocaleString()}</b></div><div class="metric"><small>OBJECTIVE REWARDS</small><b>${a.done}</b></div><div class="metric"><small>ACHIEVEMENTS</small><b>${a.ach}</b></div></div><section class="group"><h2>ECONOMY LEDGER · LAST ${a.ledger.length}</h2><div class="ledger">${a.ledger.length?a.ledger.map(x=>`<div class="tx"><div><b>${x.reason||'transaction'}</b><small>${x.currency} · ${x.sourceId||'—'}</small></div><strong class="${x.delta>=0?'plus':'minus'}">${x.delta>=0?'+':''}${x.delta.toLocaleString()}</strong></div>`).join(''):'<small>No economy transactions yet.</small>'}</div></section>`}
function render(){app.innerHTML='';for(const group of AdminTuningSchema.groups){const box=document.createElement('section');box.className='group';box.innerHTML='<h2>'+group.label+'</h2>';for(const f of group.fields){const row=document.createElement('div');row.className='row';const v=AdminTuningService.get(f.id);row.innerHTML='<div><label>'+f.label+'</label><small>'+f.id+(f.unit?' · '+f.unit:'')+'</small></div><div class="control"><input inputmode="decimal" type="number" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+v+'"><button>↺</button></div>';const input=row.querySelector('input'),reset=row.querySelector('button');input.onchange=()=>{const saved=AdminTuningService.set(f.id,input.value);input.value=saved;status.textContent='Saved '+f.label+' = '+saved;status.className='notice saved'};reset.onclick=()=>{AdminTuningService.reset(f.id);render();status.textContent='Reset '+f.label;status.className='notice saved'};box.appendChild(row)}app.appendChild(box)}}document.querySelector('#resetAll').onclick=()=>{AdminTuningService.resetAll();render();status.textContent='All tuning values reset';status.className='notice saved'};render();renderAnalytics();
</script></body></html>
