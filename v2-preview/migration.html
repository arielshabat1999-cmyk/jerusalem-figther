<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#01040a"><title>Neon Survivor — Migration</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;color:#eaffff;font-family:system-ui}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#01040a}.bar{position:fixed;z-index:9999;top:max(8px,env(safe-area-inset-top));left:8px;display:flex;gap:6px}.bar button,.bar b{border:1px solid #67e8f977;background:#06101aee;color:#eaffff;border-radius:9px;padding:8px 10px;font:800 10px system-ui;letter-spacing:.05em}.bar button{pointer-events:auto}</style></head><body><iframe id="game" allow="autoplay; fullscreen"></iframe><div class="bar"><b id="mode">ARCHITECTURE</b><button id="swap">LEGACY</button></div><script>(()=>{const q=new URLSearchParams(location.search),frame=document.querySelector('#game'),mode=document.querySelector('#mode'),swap=document.querySelector('#swap');let current=q.get('engine')==='legacy'?'legacy':'architecture';function load(){const legacy=current==='legacy';mode.textContent=legacy?'LEGACY FALLBACK':'ARCHITECTURE';swap.textContent=legacy?'ARCHITECTURE':'LEGACY';frame.src=legacy?'index.html':'architecture.html'}swap.onclick=()=>{current=current==='legacy'?'architecture':'legacy';load()};load()})();</script></body></html>
