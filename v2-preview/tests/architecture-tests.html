<!doctype html><html><head><meta charset="utf-8"><title>Architecture Tests</title><style>body{background:#07101b;color:#eaffff;font:14px monospace;padding:24px}.ok{color:#86efac}.bad{color:#fda4af}</style></head><body><h1>NEON SURVIVOR — ARCHITECTURE TESTS</h1><pre id="out">BOOTING…</pre><script src="../src/core/manifest.js"></script><script>(async()=>{const out=document.querySelector('#out'),results=[];const test=(name,fn)=>{try{const r=fn();if(r===false)throw Error('assertion failed');results.push(['PASS',name])}catch(e){results.push(['FAIL',name,e.message])}};try{localStorage.clear();for(const src of ARCHITECTURE_MODULES)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='../'+src+'?test=3';s.onload=ok;s.onerror=()=>fail(Error('load '+src));document.head.appendChild(s)});await GameBootstrap.start();OfflineServices.install();SessionSystem.begin({playerId:'test-player',gameMode:'solo',authority:'local'});GameModeSystem.activate('solo');test('dependency graph resolves',()=>GameSystems.status().started.length>0);test('rank starts clean',()=>RankSystem.snapshot().rank===1);test('rank has four objectives',()=>RankSystem.snapshot().objectives.length===4);GameplayLifecycle.newRun();GameClock.pause('tests');let p=WorldSystem.findByPlayerId('test-player');test('player spawned exactly once',()=>!!p&&WorldSystem.listByType('player').length===1);test('world type index works',()=>WorldSystem.listByType('player')[0]===p);test('world player index works',()=>WorldSystem.findByPlayerId('test-player')===p);const e=SpawnSystem.enemy('scout',{x:p.transform.x+20,y:p.transform.y});test('enemy index updated',()=>WorldSystem.listByType('enemy').includes(e));const hp=p.health.current;CombatSystem.applyDamage({sourceId:e.entityId,targetId:p.entityId,amount:1});test('player damage applied once',()=>p.health.current===hp-1);CombatSystem.applyDamage({sourceId:p.entityId,targetId:e.entityId,amount:99999});test('dead enemy removed',()=>!WorldSystem.get(e.entityId));test('dead enemy removed from index',()=>!WorldSystem.listByType('enemy').some(x=>x.entityId===e.entityId));const score=RunCommands.snapshot().score;test('player kill grants score',()=>score>0);const before=WorldSystem.count();GameplayLifecycle.restart();GameClock.pause('tests-restart');p=WorldSystem.findByPlayerId('test-player');test('restart creates one clean player',()=>!!p&&WorldSystem.listByType('player').length===1);test('restart clears previous world',()=>WorldSystem.count()<=before);test('weapon reset exists',()=>typeof WeaponSystem.reset==='function');test('upgrade choice API exists',()=>typeof UpgradeChoiceSystem.select==='function');RunCommands.end({reason:'test'});const endHp=p.health.current;test('post-run damage blocked',()=>CombatSystem.applyDamage({sourceId:null,targetId:p.entityId,amount:1}).applied===0&&p.health.current===endHp);test('world bounds configured',()=>WorldBoundsSystem.contains(0,0));test('rank storage versioned',()=>{const box=GameStorage.read('progression.rank.v4',null);return box?.version===4});test('account identity exists',()=>!!AccountSystem.playerId());test('customization service loaded',()=>typeof CustomizationSystem.snapshot==='function');test('network validation loaded',()=>typeof CommandValidationSystem.validate==='function');GameClock.stop()}catch(e){results.push(['FAIL','boot',e.stack||e.message])}const pass=results.filter(r=>r[0]==='PASS').length,fail=results.length-pass;out.innerHTML=`${pass} PASS / ${fail} FAIL\n\n`+results.map(r=>`<span class="${r[0]==='PASS'?'ok':'bad'}">${r.join(' — ')}</span>`).join('\n');document.title=fail?`FAIL ${fail} — Architecture Tests`:`PASS ${pass} — Architecture Tests`;window.__ARCH_TEST_RESULTS__=results})();</script></body></html>
