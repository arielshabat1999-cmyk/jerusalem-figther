<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Jerusalem Fighter</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none}body{min-height:100vh;overflow:hidden}#game{position:relative;width:100vw;height:100vh;overflow:hidden;touch-action:none;background:#b9d8ef}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:13px;text-shadow:0 1px 3px #000;z-index:3}#hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:380px;background:rgba(0,0,0,.34);padding:8px 10px;border-radius:14px;text-align:center;font-size:12px;pointer-events:none;z-index:3}.ring,.dot{position:absolute;pointer-events:none;display:none;transform:translate(-50%,-50%);border-radius:50%;z-index:4}.ring{width:88px;height:88px;border:2px dashed rgba(255,255,255,.72)}.dot{width:22px;height:22px;background:rgba(255,255,255,.76)}</style></head><body><div id="game"><canvas id="c"></canvas><div id="hud"><span id="state">עומד</span><span id="shots">יריות: 0</span></div><div id="hint">אצבע 1: ימינה/שמאלה • למעלה: קפיצה • למטה: התכופפות • אצבע 2: ירי</div><div id="ring" class="ring"></div><div id="dot" class="dot"></div></div><script>(()=>{const g=document.getElementById('game'),c=document.getElementById('c'),x=c.getContext('2d'),st=document.getElementById('state'),sh=document.getElementById('shots'),rg=document.getElementById('ring'),dt=document.getElementById('dot');let W=390,H=844,dpr=1,gy=0,cam=0,pid=null,s=null,n=null,shots=0,last=performance.now(),anim=0,jumpLocked=false;const world={width:6200},grav=1800,dz=26,bul=[];const p={x:90,y:0,w:44,h:68,vx:0,vy:0,speed:250,jump:640,grounded:true,crouch:false,facing:1};const plats=[[520,.70,150],[820,.61,125],[1080,.73,170],[1360,.64,135],[1630,.56,130],[1930,.68,180],[2280,.60,150],[2570,.72,170],[2910,.63,135],[3210,.54,145],[3540,.69,190],[3900,.61,150],[4230,.52,145],[4550,.68,185],[4930,.59,150],[5280,.71,190]];function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);gy=H*.76;p.h=Math.max(62,Math.min(78,H*.082));p.w=p.h*.66;p.y=Math.min(p.y||gy-p.h,gy-p.h)}function pt(e){const r=g.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function stick(q){rg.style.display=dt.style.display='block';rg.style.left=q.x+'px';rg.style.top=q.y+'px';dt.style.left=q.x+'px';dt.style.top=q.y+'px'}function hide(){rg.style.display=dt.style.display='none'}function fire(){bul.push({x:p.x+(p.facing>0?p.w+15:-15),y:p.y+p.h*.45,vx:p.facing*720,life:1.35});sh.textContent='יריות: '+(++shots)}function ctl(){p.vx=0;p.crouch=false;if(!s||!n){st.textContent='עומד';return}const dx=n.x-s.x,dy=n.y-s.y;if(Math.abs(dx)<dz&&Math.abs(dy)<dz){st.textContent='עומד';return}if(Math.abs(dy)>Math.abs(dx)*1.1){if(dy<-dz){if(p.grounded&&!jumpLocked){p.vy=-p.jump;p.grounded=false;jumpLocked=true}st.textContent='קפיצה'}else{p.crouch=true;st.textContent='התכופפות'}}else if(dx>dz){p.vx=p.speed;p.facing=1;st.textContent='ריצה ימינה'}else if(dx<-dz){p.vx=-p.speed;p.facing=-1;st.textContent='ריצה שמאלה'}}g.addEventListener('pointerdown',e=>{const q=pt(e);try{g.setPointerCapture(e.pointerId)}catch(_){}if(pid===null){pid=e.pointerId;s=q;n=q;stick(q)}else if(e.pointerId!==pid)fire();e.preventDefault()},{passive:false});g.addEventListener('pointermove',e=>{if(e.pointerId===pid){n=pt(e);dt.style.left=n.x+'px';dt.style.top=n.y+'px'}e.preventDefault()},{passive:false});function rel(e){if(e.pointerId===pid){pid=null;s=n=null;p.vx=0;p.crouch=false;jumpLocked=false;hide()}e.preventDefault()}g.addEventListener('pointerup',rel,{passive:false});g.addEventListener('pointercancel',rel,{passive:false});function collide(py){p.grounded=false;const cb=p.y+p.h,pb=py+p.h;for(const[a,b,w]of plats){const y=H*b;if(p.x+p.w>a&&p.x<a+w&&p.vy>=0&&pb<=y&&cb>=y){p.y=y-p.h;p.vy=0;p.grounded=true;return}}if(p.y+p.h>=gy){p.y=gy-p.h;p.vy=0;p.grounded=true}}function upd(d){ctl();anim+=d;const py=p.y;p.x=Math.max(0,Math.min(world.width-p.w,p.x+p.vx*d));p.vy+=grav*d;p.y+=p.vy*d;collide(py);const t=Math.max(0,Math.min(world.width-W,p.x-W*.28));cam+=(t-cam)*Math.min(1,d*8);for(let i=bul.length-1;i>=0;i--){bul[i].x+=bul[i].vx*d;bul[i].life-=d;if(bul[i].life<=0)bul.splice(i,1)}}function stoneBlock(a,b,w,h){x.fillStyle='#d8bd82';x.fillRect(a,b,w,h);x.strokeStyle='#a78956';x.lineWidth=1.4;x.strokeRect(a+.5,b+.5,w-1,h-1);x.fillStyle='rgba(255,255,255,.18)';x.fillRect(a+3,b+3,w-6,3);if(((a/50)|0)%3===0){x.fillStyle='#6f8c3d';x.fillRect(a+w*.55,b+h*.67,2,5)}}function stoneRun(a,b,w,h){for(let row=0;row<3;row++){const bh=h/3;let off=row%2?-26:0;for(let z=a+off;z<a+w;z+=52)stoneBlock(z,b+row*bh,52,bh)}}function hero(){const crouch=p.crouch,ph=crouch?p.h*.68:p.h,py=crouch?p.y+p.h-ph:p.y,cx=p.x+p.w/2,dir=p.facing;const running=Math.abs(p.vx)>1&&p.grounded,step=running?Math.sin(anim*18):0;x.save();x.translate(cx,py);x.scale(dir,1);x.translate(-cx,-py);x.fillStyle='#245f9f';x.fillRect(cx-16,py+22,32,ph-22);x.fillStyle='#fff';x.fillRect(cx-15,py+25,30,9);x.fillStyle='#f1c7a4';x.fillRect(cx-11,py+4,22,22);x.fillStyle='#5a3018';x.fillRect(cx-13,py+2,26,7);x.fillStyle='#fff';x.beginPath();x.arc(cx,py+1,12,Math.PI,Math.PI*2);x.fill();x.fillStyle='#2872bd';x.beginPath();x.arc(cx,py+1,10,Math.PI,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 11px Arial';x.textAlign='center';x.fillText('✡',cx,py+4);x.fillStyle='#222';x.fillRect(cx+8,py+31,30,5);x.fillRect(cx+28,py+28,5,10);x.fillStyle='#f1c7a4';x.fillRect(cx+5,py+29,9,8);if(!crouch){x.fillStyle='#173b61';x.fillRect(cx-14,py+ph-12+step*3,10,13);x.fillRect(cx+4,py+ph-12-step*3,10,13)}if(!p.grounded){x.fillStyle='#173b61';x.fillRect(cx-15,py+ph-13,12,9);x.fillRect(cx+4,py+ph-20,12,9)}x.restore()}function draw(){x.clearRect(0,0,W,H);const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a9d5ef');sky.addColorStop(.62,'#e8f1f5');sky.addColorStop(1,'#e0c999');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='rgba(177,145,96,.22)';for(let i=0;i<8;i++){const bx=i*110-(cam*.18)%110-40,bh=55+(i%3)*28;x.fillRect(bx,gy-bh-85,85,bh)}x.save();x.translate(-cam,0);stoneRun(0,gy,world.width,96);for(const[a,b,w]of plats)stoneRun(a,H*b,w,38);for(const b of bul){x.fillStyle='#222';x.fillRect(b.x-4,b.y-2,9,4);x.fillStyle='#ffcf43';x.fillRect(b.x+(b.vx>0?4:-6),b.y-1,4,2)}hero();x.restore()}function loop(t){const d=Math.min(.032,(t-last)/1000);last=t;upd(d);draw();requestAnimationFrame(loop)}resize();addEventListener('resize',resize,{passive:true});requestAnimationFrame(loop)})();</script></body></html>
