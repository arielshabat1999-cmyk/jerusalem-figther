<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Platformer Portrait Demo v2</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:#111;color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none}
    body{min-height:100vh;overflow:hidden}
    #game{position:relative;width:100vw;height:100vh;overflow:hidden;touch-action:none;background:#b9d8ef}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:13px;text-shadow:0 1px 3px #000;z-index:3}
    #hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:380px;background:rgba(0,0,0,.48);padding:8px 10px;border-radius:14px;text-align:center;font-size:12px;line-height:1.35;pointer-events:none;z-index:3}
    #debug{position:absolute;top:max(40px,calc(env(safe-area-inset-top) + 36px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.35);padding:6px 10px;border-radius:10px;font-size:12px;z-index:3;pointer-events:none}
    .ring,.dot{position:absolute;pointer-events:none;display:none;transform:translate(-50%,-50%);border-radius:50%;z-index:4}
    .ring{width:88px;height:88px;border:2px dashed rgba(255,255,255,.75)}
    .dot{width:22px;height:22px;background:rgba(255,255,255,.78)}
  </style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud"><span id="state">עומד</span><span id="shots">יריות: 0</span></div>
  <div id="debug">אם אתה רואה רצפה חומה ודמות כחולה — זה תקין</div>
  <div id="hint">אצבע 1: ימינה/שמאלה • למעלה: קפיצה • למטה: התכופפות • אצבע 2: ירי</div>
  <div id="ring" class="ring"></div>
  <div id="dot" class="dot"></div>
</div>
<script>
(() => {
  const game = document.getElementById('game');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stateEl = document.getElementById('state');
  const shotsEl = document.getElementById('shots');
  const ring = document.getElementById('ring');
  const dot = document.getElementById('dot');
  let W=390,H=844,dpr=1,groundY=0;
  const world={width:6200};
  const player={x:90,y:0,w:34,h:56,vx:0,vy:0,speed:250,jump:640,grounded:true,crouch:false,facing:1};
  const gravity=1800, deadZone=26;
  let cameraX=0, primaryId=null, start=null, nowPt=null, shots=0;
  const bullets=[];
  const platformDefs=[[520,.70,150],[820,.61,125],[1080,.73,170],[1360,.64,135],[1630,.56,130],[1930,.68,180],[2280,.60,150],[2570,.72,170],[2910,.63,135],[3210,.54,145],[3540,.69,190],[3900,.61,150],[4230,.52,145],[4550,.68,185],[4930,.59,150],[5280,.71,190]];
  function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);groundY=H*0.76;player.h=Math.max(52,Math.min(66,H*0.07));player.w=Math.round(player.h*0.62);player.y=groundY-player.h;draw();}
  function pLocal(e){const r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  function showStick(p){ring.style.display='block';dot.style.display='block';ring.style.left=p.x+'px';ring.style.top=p.y+'px';dot.style.left=p.x+'px';dot.style.top=p.y+'px';}
  function hideStick(){ring.style.display='none';dot.style.display='none';}
  function fire(){bullets.push({x:player.x+(player.facing>0?player.w+6:-6),y:player.y+player.h*0.42,vx:player.facing*720,life:1.35});shots++;shotsEl.textContent='יריות: '+shots;}
  function control(){player.vx=0;player.crouch=false;if(!start||!nowPt){stateEl.textContent='עומד';return;}const dx=nowPt.x-start.x,dy=nowPt.y-start.y;if(Math.abs(dx)<deadZone&&Math.abs(dy)<deadZone){stateEl.textContent='עומד';return;}if(Math.abs(dy)>Math.abs(dx)*1.1){if(dy<-deadZone){if(player.grounded){player.vy=-player.jump;player.grounded=false;}stateEl.textContent='קפיצה';}else{player.crouch=true;stateEl.textContent='התכופפות';}}else{if(dx>deadZone){player.vx=player.speed;player.facing=1;stateEl.textContent='ריצה ימינה';}else if(dx<-deadZone){player.vx=-player.speed;player.facing=-1;stateEl.textContent='ריצה שמאלה';}}}
  game.addEventListener('pointerdown',e=>{const p=pLocal(e);try{game.setPointerCapture(e.pointerId)}catch(_){}if(primaryId===null){primaryId=e.pointerId;start=p;nowPt=p;showStick(p);}else if(e.pointerId!==primaryId){fire();}e.preventDefault();},{passive:false});
  game.addEventListener('pointermove',e=>{if(e.pointerId===primaryId){nowPt=pLocal(e);dot.style.left=nowPt.x+'px';dot.style.top=nowPt.y+'px';}e.preventDefault();},{passive:false});
  function release(e){if(e.pointerId===primaryId){primaryId=null;start=null;nowPt=null;player.vx=0;player.crouch=false;hideStick();}e.preventDefault();}
  game.addEventListener('pointerup',release,{passive:false});game.addEventListener('pointercancel',release,{passive:false});
  function resolvePlatforms(prevY){player.grounded=false;const currentBottom=player.y+player.h,prevBottom=prevY+player.h;for(const def of platformDefs){const[x,yr,w]=def,y=H*yr;const overlap=player.x+player.w>x&&player.x<x+w;if(overlap&&player.vy>=0&&prevBottom<=y&&currentBottom>=y){player.y=y-player.h;player.vy=0;player.grounded=true;return;}}if(player.y+player.h>=groundY){player.y=groundY-player.h;player.vy=0;player.grounded=true;}}
  function stone(x,y,w,h){ctx.fillStyle='#d8c08d';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#a78f63';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);}
  function update(dt){control();const prevY=player.y;player.x+=player.vx*dt;player.x=Math.max(0,Math.min(world.width-player.w,player.x));player.vy+=gravity*dt;player.y+=player.vy*dt;resolvePlatforms(prevY);const target=player.x-W*0.28;const clamped=Math.max(0,Math.min(world.width-W,target));cameraX+=(clamped-cameraX)*Math.min(1,dt*8);for(let i=bullets.length-1;i>=0;i--){bullets[i].x+=bullets[i].vx*dt;bullets[i].life-=dt;if(bullets[i].life<=0)bullets.splice(i,1);}}
  function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a9d5ef');sky.addColorStop(.62,'#e8f1f5');sky.addColorStop(1,'#e0c999');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(177,145,96,.22)';for(let i=0;i<8;i++){const bx=(i*110-(cameraX*.18)%110)-40,bh=55+(i%3)*28;ctx.fillRect(bx,groundY-bh-85,85,bh);}ctx.save();ctx.translate(-cameraX,0);ctx.fillStyle='#cbb07b';ctx.fillRect(0,groundY,world.width,H-groundY);for(let x=0;x<world.width;x+=64){stone(x,groundY,64,31);stone(x+16,groundY+31,64,31);stone(x-8,groundY+62,64,31);}for(const def of platformDefs){const[x,yr,w]=def,y=H*yr;for(let sx=x;sx<x+w;sx+=52){stone(sx,y,Math.min(52,x+w-sx),24);}}for(const b of bullets){ctx.fillStyle='#252525';ctx.fillRect(b.x-4,b.y-2,9,4);}const ph=player.crouch?player.h*.67:player.h;const py=player.crouch?player.y+(player.h-ph):player.y;ctx.fillStyle='rgba(255,0,0,.22)';ctx.fillRect(player.x-10,py-10,player.w+20,ph+20);ctx.fillStyle='#24548c';ctx.fillRect(player.x,py,player.w,ph);ctx.fillStyle='#f0d0ad';ctx.fillRect(player.x+player.w*.18,py+4,player.w*.60,player.h*.30);ctx.fillStyle='#ffffff';ctx.fillRect(player.x+3,py+player.h*.32,player.w-6,player.h*.14);ctx.fillStyle='#1f65a9';ctx.fillRect(player.x+4,py+player.h*.46,player.w-8,Math.max(6,ph-player.h*.46));ctx.fillStyle='#173b61';ctx.fillRect(player.x+player.w*.25,py-4,player.w*.5,6);ctx.fillStyle='#222';const gunY=py+player.h*.43;if(player.facing>0)ctx.fillRect(player.x+player.w*.72,gunY,27,4);else ctx.fillRect(player.x-18,gunY,27,4);ctx.restore();}
  resize();let last=performance.now();function loop(t){const dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}addEventListener('resize',resize,{passive:true});requestAnimationFrame(loop);
})();
</script>
</body>
</html>
