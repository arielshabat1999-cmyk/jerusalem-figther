name: Architecture QA

on:
  push:
    branches: [architecture-phase-1]
  pull_request:
  workflow_dispatch:

jobs:
  architecture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Serve game
        run: python3 -m http.server 4173 --directory neon-survivor > /tmp/neon-http.log 2>&1 &
      - name: Run architecture regression, migration and cutover smoke tests
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}}),errors=[];
            page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/tests/architecture-tests.html',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>Array.isArray(window.__ARCH_TEST_RESULTS__),null,{timeout:15000});
            const results=await page.evaluate(()=>window.__ARCH_TEST_RESULTS__); console.log(results.map(r=>r.join(' — ')).join('\n'));
            const failed=results.filter(r=>r[0]!=='PASS');
            const migration=await browser.newPage({viewport:{width:390,height:844}}),migrationErrors=[]; migration.on('pageerror',e=>migrationErrors.push(String(e)));
            await migration.goto('http://127.0.0.1:4173/migration.html',{waitUntil:'networkidle'});
            await migration.waitForFunction(()=>document.querySelector('#game')?.contentWindow?.GameSystems?.status?.().started?.length>0,null,{timeout:15000});
            const state=await migration.evaluate(()=>({mode:document.querySelector('#mode').textContent,systems:document.querySelector('#game').contentWindow.GameSystems.status().started.length,player:!!document.querySelector('#game').contentWindow.WorldSystem.findByPlayerId('local-player')})); console.log('MIGRATION — '+JSON.stringify(state));
            if(state.mode!=='ARCHITECTURE'||!state.player||state.systems<1)migrationErrors.push('migration architecture boot invalid');
            const cutover=await browser.newPage({viewport:{width:390,height:844}}),cutoverErrors=[]; cutover.on('pageerror',e=>cutoverErrors.push(String(e)));
            await cutover.goto('http://127.0.0.1:4173/play.html',{waitUntil:'networkidle'});
            await cutover.waitForFunction(()=>document.querySelector('#game')?.contentWindow?.GameSystems?.status?.().started?.length>0,null,{timeout:15000});
            const cut=await cutover.evaluate(()=>({engine:window.NEON_CUTOVER?.engine,player:!!document.querySelector('#game').contentWindow.WorldSystem.findByPlayerId('local-player')})); console.log('CUTOVER — '+JSON.stringify(cut));
            if(cut.engine!=='architecture'||!cut.player)cutoverErrors.push('production cutover invalid');
            const primary=await browser.newPage({viewport:{width:390,height:844}}),primaryErrors=[]; primary.on('pageerror',e=>primaryErrors.push(String(e)));
            await primary.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            await primary.waitForFunction(()=>document.querySelector('#game')?.contentWindow?.GameSystems?.status?.().started?.length>0,null,{timeout:15000});
            const main=await primary.evaluate(()=>({engine:window.NEON_CUTOVER?.engine,player:!!document.querySelector('#game').contentWindow.WorldSystem.findByPlayerId('local-player')})); console.log('PRIMARY — '+JSON.stringify(main));
            if(main.engine!=='architecture'||!main.player)primaryErrors.push('primary index cutover invalid');
            const fallback=await browser.newPage({viewport:{width:390,height:844}}),fallbackErrors=[]; fallback.on('pageerror',e=>fallbackErrors.push(String(e)));
            await fallback.goto('http://127.0.0.1:4173/play.html?engine=legacy',{waitUntil:'domcontentloaded'});
            const fb=await fallback.evaluate(()=>({engine:window.NEON_CUTOVER?.engine,outer:document.querySelector('#game')?.contentWindow?.document?.querySelector('iframe')?.getAttribute('src')})); console.log('FALLBACK — '+JSON.stringify(fb));
            if(fb.engine!=='legacy'||fb.outer!=='legacy-runtime.html')fallbackErrors.push('dedicated legacy fallback invalid');
            await browser.close();
            if(errors.length||failed.length||migrationErrors.length||cutoverErrors.length||primaryErrors.length||fallbackErrors.length){console.error([...errors,...migrationErrors,...cutoverErrors,...primaryErrors,...fallbackErrors].join('\n'));process.exit(1)}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
