name: Architecture QA
on:
  push:
    branches: [main, architecture-phase-1]
  pull_request:
  workflow_dispatch:
jobs:
  architecture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Serve game
        run: python3 -m http.server 4173 --directory v2-preview > /tmp/neon-http.log 2>&1 &
      - name: Run V2 Run crash + reload QA
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const p=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];p.on('pageerror',e=>errors.push('pageerror: '+e.message));p.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            async function boot(){await p.goto('http://127.0.0.1:4173/index.html?v=run-crash-qa',{waitUntil:'domcontentloaded'});const f=p.frames().find(x=>x!==p.mainFrame());await f.waitForFunction(()=>window.GameBootstrap?.status==='ready'&&!document.querySelector('#boot'),null,{timeout:50000});return f}
            async function start(f){await f.locator('[data-action="play"]').click();await f.waitForFunction(()=>AppFlowSystem.snapshot().state==='playing'&&RunCommands.snapshot()?.active&&GameClock.running&&!GameClock.paused,null,{timeout:5000});const t=await f.evaluate(()=>RunCommands.snapshot().time);await f.waitForTimeout(700);const t2=await f.evaluate(()=>RunCommands.snapshot().time);if(!(t2>t))throw new Error('RUN FROZEN: run time did not advance')}
            let f=await boot();await start(f);
            // pause/resume
            await f.locator('.run-pause').click();if(!await f.evaluate(()=>GameClock.paused&&GameClock.hasPauseReason('pause-menu')))throw new Error('pause-menu did not pause');await f.locator('[data-pause-action="resume"]').click();await f.waitForTimeout(300);if(await f.evaluate(()=>GameClock.paused))throw new Error('resume left clock paused');
            // Evolution deck open/close with no choice
            await f.locator('.evo-tab').click();if(!await f.evaluate(()=>GameClock.hasPauseReason('evolution-deck')))throw new Error('evolution deck did not own pause');await f.locator('.evo-tab').click();await f.waitForTimeout(250);if(await f.evaluate(()=>GameClock.paused))throw new Error('evolution close leaked pause');
            // restart stress
            for(let i=0;i<5;i++){await f.locator('.run-pause').click();await f.locator('[data-pause-action="restart"]').click();await f.waitForFunction(()=>RunCommands.snapshot()?.active&&!GameClock.paused,null,{timeout:3000});const a=await f.evaluate(()=>RunCommands.snapshot().time);await f.waitForTimeout(250);const b=await f.evaluate(()=>RunCommands.snapshot().time);if(!(b>a))throw new Error('restart '+i+' froze simulation')}
            // hard reload while a run is active: boot must recover to a usable home, then a new run must move
            await p.reload({waitUntil:'domcontentloaded'});f=p.frames().find(x=>x!==p.mainFrame());await f.waitForFunction(()=>window.GameBootstrap?.status==='ready'&&!document.querySelector('#boot'),null,{timeout:50000});if(await f.evaluate(()=>GameClock.running||GameClock.paused))throw new Error('reload leaked clock state before run');await start(f);
            // repeated reload/start cycles
            for(let i=0;i<3;i++){await p.reload({waitUntil:'domcontentloaded'});f=p.frames().find(x=>x!==p.mainFrame());await f.waitForFunction(()=>window.GameBootstrap?.status==='ready'&&!document.querySelector('#boot'),null,{timeout:50000});await start(f)}
            const entities=await f.evaluate(()=>({players:WorldSystem.listByType('player').length,run:RunCommands.snapshot(),clock:{running:GameClock.running,paused:GameClock.paused,reasons:GameClock.pauseReasons}}));if(entities.players!==1)throw new Error('expected one player entity, got '+entities.players);console.log('RUN STATE',JSON.stringify(entities));
            await browser.close();if(errors.length){console.error(errors.join('\n'));process.exit(1)}console.log('RUN CRASH + RELOAD QA — PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
